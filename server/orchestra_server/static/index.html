<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>orchestra</title>
<meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Grayscale typewriter. Hierarchy comes from weight, inversion, rules and hatching, not hue.
   A deployment can restyle via /brand.css (loaded last): override --f-body / --f-display, add @font-face. */
:root {
  --bg: #ffffff; --surface: #ffffff; --surface2: #f3f4f6; --fg: #0b0c0e; --muted: #5a626d; --faint: #8b939d;
  --line: #d5d9de; --rule: #0b0c0e; --hatch: #c9ced5; --chip: #f3f4f6; --shadow: 0 10px 40px rgba(11,12,14,.14);
  --f-body: "Courier Prime", "Courier New", ui-monospace, monospace;
  --f-display: var(--f-body);
  --gutter: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0c0e; --surface: #0b0c0e; --surface2: #15181c; --fg: #f2f3f5; --muted: #9aa3ad; --faint: #6b737e;
  --line: #2b3038; --rule: #f2f3f5; --hatch: #39404a; --chip: #15181c; --shadow: 0 10px 40px rgba(0,0,0,.6);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b0c0e; --surface: #0b0c0e; --surface2: #15181c; --fg: #f2f3f5; --muted: #9aa3ad; --faint: #6b737e;
  --line: #2b3038; --rule: #f2f3f5; --hatch: #39404a; --chip: #15181c; --shadow: 0 10px 40px rgba(0,0,0,.6);
  color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; min-height: 100vh; }
button, textarea, select, input { font: inherit; color: inherit; }
a { color: var(--fg); text-decoration-thickness: 1px; text-underline-offset: 2px; }
::selection { background: var(--fg); color: var(--bg); }
:focus-visible { outline: 1px solid var(--fg); outline-offset: 2px; }

/* buttons: primary is inverted, secondary is ruled, ghost is text */
.btn { background: transparent; border: 1px solid var(--fg); color: var(--fg); padding: 7px 14px; cursor: pointer; border-radius: 2px; letter-spacing: .02em; }
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--fg); color: var(--bg); font-weight: 700; }
.btn.primary:hover { opacity: .88; background: var(--fg); }
.btn.ghost { border-color: transparent; color: var(--muted); padding: 7px 8px; }
.btn.ghost:hover { color: var(--fg); background: transparent; text-decoration: underline; }
.btn:disabled { opacity: .4; cursor: default; }
textarea, input[type=password] {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 10px 12px; resize: vertical;
}
textarea:focus, input:focus { border-color: var(--fg); outline: none; }
.lbl { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* ---- header ---- */
header.top {
  position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--rule);
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(var(--gutter), env(safe-area-inset-right, 0px)) 10px max(var(--gutter), env(safe-area-inset-left, 0px));
}
.wordmark { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .01em; margin: 0; }
.eyebrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.dot { width: 8px; height: 8px; border: 1px solid var(--fg); display: inline-block; border-radius: 50%; }
.dot.on { background: var(--fg); }
.spacer { flex: 1; }

nav.tabs { display: none; border-bottom: 1px solid var(--line); padding: 0 var(--gutter); }
nav.tabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 4px; cursor: pointer; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-size: 13px; }
nav.tabs button.active { color: var(--fg); border-bottom-color: var(--fg); font-weight: 700; }

main {
  display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) 380px; gap: 28px;
  padding: 22px max(var(--gutter), env(safe-area-inset-right, 0px)) 72px max(var(--gutter), env(safe-area-inset-left, 0px));
  max-width: 1680px; margin: 0 auto;
}
main > section, main > aside { min-width: 0; }
.sec-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.sec-h h2 { font-family: var(--f-display); font-size: 15px; letter-spacing: .14em; text-transform: uppercase; margin: 0; }
.sec-h .n { font-size: 13px; color: var(--muted); }
.sec-h .tools { margin-left: auto; display: flex; gap: 12px; font-size: 12.5px; color: var(--muted); }
.sec-h .tools label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
.sec-h .tools input { accent-color: var(--fg); }
.empty { color: var(--faint); padding: 26px 12px; text-align: center; border: 1px dashed var(--line); }

/* ---- inbox: form carries urgency ---- */
.card { border: 1px solid var(--line); padding: 14px 16px; margin-bottom: 14px; background: var(--surface); }
.card.ask { border: 2px solid var(--fg); }
.card.request { border: 1px solid var(--fg); }
.card.note { border: 1px dashed var(--muted); }
.card.flash { box-shadow: 0 0 0 3px var(--fg); }
.card .meta { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.card .meta .who { color: var(--fg); font-weight: 700; }
.card .meta .id { margin-left: auto; color: var(--faint); font-size: 12px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; padding: 1px 7px; border: 1px solid var(--fg); }
.tag.ask { background: var(--fg); color: var(--bg); }
.tag.note { border-style: dashed; border-color: var(--muted); color: var(--muted); }
.card .body { white-space: pre-wrap; overflow-wrap: anywhere; margin: 10px 0; font-size: 15.5px; }
.dflt { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13.5px; padding: 8px 10px; border-left: 3px solid var(--fg); background: var(--surface2); margin: 8px 0; }
.dflt .k { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 11.5px; padding-top: 2px; }
.countdown { display: inline-block; font-variant-numeric: tabular-nums; font-weight: 700; margin-top: 4px; padding: 1px 0; }
.countdown.soon { background: var(--fg); color: var(--bg); padding: 1px 8px; }
.ctx { font-size: 13.5px; color: var(--muted); border-left: 1px solid var(--line); padding: 2px 0 2px 10px; margin: 6px 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.opts { display: grid; gap: 6px; margin: 10px 0 4px; }
.opts .hint { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.opt { display: grid; grid-template-columns: 22px 1fr; gap: 2px 8px; text-align: left; background: transparent; border: 1px solid var(--line); padding: 8px 10px; cursor: pointer; border-radius: 2px; }
.opt:hover { border-color: var(--fg); }
.opt[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 3px 0 0 var(--fg); background: var(--surface2); }
.opt .mk { font-weight: 700; }
.opt .ol { font-weight: 700; }
.opt .badge { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; border: 1px solid currentColor; padding: 0 5px; margin-left: 8px; font-weight: 400; color: var(--muted); }
.opt .badge.rec { color: var(--fg); }
.opt .od { grid-column: 2; font-size: 13.5px; color: var(--muted); white-space: pre-wrap; }
.opt.closed { cursor: default; }
.disc { margin: 10px 0 0; border-top: 1px solid var(--line); }
.disc .d { padding: 6px 0 0; font-size: 14px; }
.disc .d .who { font-weight: 700; } .disc .d .when { color: var(--faint); font-size: 12px; margin-left: 6px; }
.disc .d.op { padding-left: 10px; border-left: 2px solid var(--fg); }
.disc .d .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.reply { margin-top: 10px; display: grid; gap: 8px; }
.reply .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.reply .row .spacer { flex: 1; }
details.closed { margin-top: 18px; }
details.closed summary { cursor: pointer; color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.card.done { opacity: .6; border: 1px solid var(--line); }
.res { font-size: 13.5px; }
.sent .ans { border-top: 1px solid var(--line); padding: 8px 0 2px; }
.sent .ans .who { font-weight: 700; } .sent .ans .when { color: var(--faint); font-size: 12px; margin-left: 8px; }
.sent .ans .txt { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; font-size: 14.5px; }
.sent .ansact { margin-top: 4px; }
.sent .mine { margin: 6px 0 0 14px; padding-left: 10px; border-left: 2px solid var(--fg); font-size: 14px; }
.sent .mine .who { font-weight: 700; }
.sent .waiting { color: var(--faint); font-size: 13px; padding: 6px 0; }
.sent-h { margin-top: 30px; }
.res b { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; }

/* ---- bus ---- */
.ev { position: relative; display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 8px 6px; border-bottom: 1px solid var(--line); font-size: 14px; cursor: pointer; }
.ev:hover { background: var(--surface2); }
.ev .ts { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12.5px; padding-top: 1px; }
.ev .head { color: var(--muted); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.ev .head b { color: var(--fg); }
.ev .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; border: 1px solid var(--line); padding: 0 5px; }
.ev .txt { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
.ev.status .txt { color: var(--muted); }
.ev.op .head b { text-decoration: underline; text-underline-offset: 3px; }
.ev.ask, .ev.halt { border-left: 6px solid transparent; border-image: repeating-linear-gradient(135deg, var(--fg) 0 2px, transparent 2px 5px) 6; }
.search { display: flex; gap: 8px; margin: 0 0 10px; }
.search input { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 7px 10px; }
.search input:focus { border-color: var(--fg); outline: none; }
.searchnote { font-size: 12.5px; color: var(--muted); margin: -4px 0 8px; display: flex; gap: 10px; align-items: baseline; }
.idlink { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.idlink:hover { color: var(--fg); }
.mini { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 2px 8px; font-size: 12.5px; cursor: pointer; border-radius: 2px; }
.mini:hover { border-color: var(--fg); color: var(--fg); }
.ev .re { position: absolute; top: 8px; right: 6px; color: var(--faint); font-size: 12px; visibility: hidden; background: var(--surface2); padding-left: 6px; }
.ev:hover .re { visibility: visible; }

/* ---- compose: the operator's desk ---- */
aside#side { align-self: start; position: sticky; top: 72px; }
.desk { border: 2px solid var(--fg); background: var(--surface); padding: 16px; box-shadow: var(--shadow); }
.desk h2 { font-family: var(--f-display); font-size: 15px; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 14px; }
.field { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; margin-bottom: 12px; }
.field > .lbl { padding-top: 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 132px; overflow-y: auto; }
.chip { font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; cursor: pointer; background: transparent; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip:hover { border-color: var(--fg); color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 700; }
.chip.np { border-style: dashed; }
.chip.away { border-style: dotted; opacity: .75; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--fg); }
.seg button { background: transparent; border: 0; border-left: 1px solid var(--fg); padding: 6px 4px; cursor: pointer; font-size: 13.5px; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); font-weight: 700; }
.kindhint { grid-column: 2; font-size: 12.5px; color: var(--muted); margin-top: -4px; }
#msg { min-height: 140px; font-size: 15.5px; line-height: 1.5; }
.sendrow { display: grid; gap: 6px; margin-top: 10px; }
#sendBtn { padding: 12px 14px; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
#sendBtn .to { font-weight: 400; text-transform: none; letter-spacing: 0; opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kbd { font-size: 12px; color: var(--muted); text-align: right; }
.control { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.control .btn { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sessions { margin-top: 22px; }
.sess { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 8px; align-items: center; padding: 7px 4px; border-bottom: 1px solid var(--line); font-size: 14px; cursor: pointer; }
.sess:hover { background: var(--surface2); }
.sess .h { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sm .rc { display: inline-block; margin-top: 3px; font-weight: 400; }
.sess .rc, .sm .rc { font-size: 12px; color: var(--muted); text-decoration: none; border: 1px solid var(--line); padding: 0 6px; white-space: nowrap; }
.sess .rc:hover, .sm .rc:hover { color: var(--fg); border-color: var(--fg); }
.sess .stale { border: 1px dashed var(--fg); color: var(--fg); padding: 0 5px; text-transform: none; letter-spacing: 0; }
.sess .st { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.sess.off { color: var(--faint); }
.foot { margin-top: 16px; display: flex; gap: 4px; flex-wrap: wrap; font-size: 12.5px; }

/* ---- login / toast ---- */
#login { max-width: 420px; margin: 18vh auto; padding: 0 var(--gutter); }
#login .wordmark { font-size: 34px; }
#login p { color: var(--muted); }
#login .row { display: flex; gap: 8px; margin-top: 10px; }
#toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 16px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 32px); z-index: 20; }
#toast.show { opacity: 1; }

/* ---- telemetry ---- */
:root { --s1: #e3e6ea; --s2: #c3c8cf; --s3: #8f97a1; --s4: #4f5761; --s5: #0b0c0e; --grid: #e6e8eb; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --s1: #1b1f25; --s2: #353b44; --s3: #6b737e; --s4: #aab2bc; --s5: #f2f3f5; --grid: #1f2329; } }
:root[data-theme="dark"] { --s1: #1b1f25; --s2: #353b44; --s3: #6b737e; --s4: #aab2bc; --s5: #f2f3f5; --grid: #1f2329; }
#telem { padding: 22px max(var(--gutter), env(safe-area-inset-right, 0px)) 72px max(var(--gutter), env(safe-area-inset-left, 0px)); max-width: 1680px; margin: 0 auto; }
.tfilters { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.tfilters .seg { grid-template-columns: repeat(4, 64px); }
.tfilters .upd { font-size: 12.5px; color: var(--muted); }
#telemBody.loading { opacity: .55; transition: opacity .2s; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 22px; }
.tile { border: 1px solid var(--line); padding: 12px 14px; }
.tile .tl { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.tile .tv { font-size: 30px; font-weight: 700; line-height: 1.15; margin-top: 4px; }
.tile .ts2 { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.tgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; }
.tcard { border: 1px solid var(--rule); padding: 14px 16px; min-width: 0; }
.tcard.wide { grid-column: 1 / -1; }
.tcard h3 { font-family: var(--f-display); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; margin: 0; }
.tcard .sub { font-size: 12.5px; color: var(--muted); margin: 2px 0 10px; }
.tcard svg { display: block; width: 100%; overflow: visible; }
.tcard svg text { fill: var(--muted); font-family: var(--f-body); font-size: 11px; }
.tcard svg .gl { stroke: var(--grid); stroke-width: 1; }
.tcard svg .ax { stroke: var(--line); stroke-width: 1; }
.tcard svg .bar { fill: var(--fg); }
.tcard svg .hit { fill: transparent; cursor: crosshair; }
.tcard svg .hit:hover + .bar, .tcard svg .bar.hot { opacity: .7; }
.tcard svg .ln { fill: none; stroke: var(--fg); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.tcard svg .ar { fill: var(--fg); opacity: .1; }
.tcard svg .xh { stroke: var(--muted); stroke-width: 1; }
.tcard svg .dot { fill: var(--fg); stroke: var(--surface); stroke-width: 2; }
.sm { display: grid; grid-template-columns: minmax(120px, 220px) minmax(0, 1fr) 90px 110px; gap: 4px 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.sm.head { color: var(--muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-top: 0; }
.sm .h { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.sm .h small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.sm .num { text-align: right; font-variant-numeric: tabular-nums; }
.mx { border-collapse: separate; border-spacing: 2px; font-size: 12.5px; }
.mx th { font-weight: 400; color: var(--muted); padding: 2px 6px; text-align: left; white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
.mx thead th { writing-mode: vertical-rl; transform: rotate(180deg); text-align: left; height: 120px; vertical-align: bottom; }
.mx td { width: 34px; min-width: 34px; height: 26px; text-align: center; font-variant-numeric: tabular-nums; cursor: default; }
.mx td.c0 { background: transparent; color: var(--faint); }
.mx td.c1 { background: var(--s1); color: var(--fg); } .mx td.c2 { background: var(--s2); color: var(--fg); }
.mx td.c3 { background: var(--s3); color: var(--fg); } .mx td.c4 { background: var(--s4); color: var(--bg); } .mx td.c5 { background: var(--s5); color: var(--bg); }
.mx td:hover { outline: 1px solid var(--fg); }
.mxwrap { overflow-x: auto; }
.ramp { display: flex; gap: 2px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 8px; }
.ramp span.sw { width: 18px; height: 10px; display: inline-block; }
table.tt { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.tt th, table.tt td { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: right; }
table.tt th:first-child, table.tt td:first-child { text-align: left; }
table.tt th { color: var(--muted); font-weight: 400; }
details.tv { margin-top: 10px; } details.tv summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
details.tv .scroll { max-height: 280px; overflow: auto; margin-top: 6px; }
#tip { position: fixed; z-index: 30; pointer-events: none; background: var(--surface); border: 1px solid var(--fg); padding: 6px 9px; font-size: 12.5px; box-shadow: var(--shadow); max-width: 280px; display: none; }
#tip .v { font-weight: 700; font-size: 14px; } #tip .l { color: var(--muted); }
#tip .row { display: flex; gap: 8px; justify-content: space-between; }
@media (max-width: 1000px) { .tgrid { grid-template-columns: minmax(0, 1fr); } .sm { grid-template-columns: minmax(0, 1fr) 80px 90px; } .sm .spark { grid-column: 1 / -1; grid-row: 2; } }

@media (max-width: 1180px) {
  main { grid-template-columns: minmax(0, 1fr) 360px; }
  #inbox { grid-column: 1; grid-row: 1; } #feed { grid-column: 1; grid-row: 2; }
  aside#side { grid-column: 2; grid-row: 1 / span 2; }
}
@media (max-width: 820px) {
  main { grid-template-columns: minmax(0, 1fr); padding-top: 14px; }
  nav.tabs { display: flex; }
  main > section, main > aside { display: none; grid-column: auto !important; grid-row: auto !important; }
  main > .active { display: block; }
  aside#side { position: static; }
  .desk { box-shadow: none; }
  header.top .wide { display: none; }
}
</style>
<link rel="stylesheet" href="/brand.css">
<script src="/telemetry.js" defer></script>
</head>
<body>
<div id="login" hidden>
  <h1 class="wordmark">orchestra</h1>
  <p>Paste your operator token. It's kept as a cookie on this device.</p>
  <form onsubmit="login(event)">
    <input id="tok" type="password" autocomplete="current-password" placeholder="token" required>
    <div class="row"><button class="btn primary" type="submit">Sign in</button></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <h1 class="wordmark">orchestra</h1>
    <div class="eyebrow"><span class="dot" id="live" title="live stream"></span><span id="meta"></span></div>
    <span class="spacer"></span>
    <div class="eyebrow">
      <button class="btn ghost" id="viewBtn" onclick="toggleView()">telemetry</button>
      <button class="btn ghost" id="pushBtn" onclick="enablePush()">enable push</button>
      <button class="btn ghost" onclick="cycleTheme()" title="theme: system → flip → system">theme</button>
    </div>
  </header>
  <nav class="tabs">
    <button data-tab="inbox" class="active">Inbox <span id="tabInbox"></span></button>
    <button data-tab="feed">Bus</button>
    <button data-tab="side">Send</button>
    <button data-tab="telem">Stats</button>
  </nav>
  <main>
    <section id="inbox" class="active">
      <div class="sec-h"><h2>Inbox</h2><span class="n" id="openCount"></span>
        <div class="tools"><select class="mini" id="inboxSort" title="sort the inbox">
          <option value="urgent">urgent first</option><option value="new">newest</option><option value="old">oldest</option><option value="who">by session</option>
        </select></div></div>
      <div id="open"></div>
      <details class="closed"><summary>recently closed</summary><div id="closed" style="margin-top:12px"></div></details>
      <div class="sec-h sent-h"><h2>Your requests</h2><span class="n" id="sentCount"></span></div>
      <div id="sent"></div>
    </section>

    <section id="feed">
      <div class="sec-h"><h2>Bus</h2>
        <div class="tools">
          <label><input type="checkbox" id="hideStatus"> hide status</label>
          <label><input type="checkbox" id="onlyMine"> mine</label>
          <button class="mini" id="feedOrder" title="sort the bus">newest first</button>
        </div>
      </div>
      <div class="search"><input id="q" type="search" placeholder="search: text, @handle, or an id" autocomplete="off" spellcheck="false"></div>
      <div class="searchnote" id="searchNote" hidden></div>
      <div id="events"></div>
    </section>

    <aside id="side">
      <div class="desk">
        <h2>Send</h2>
        <div class="field"><span class="lbl">to</span><div class="chips" id="toChips"></div></div>
        <div class="field"><span class="lbl">as</span>
          <div class="seg" id="kindSeg">
            <button data-kind="notice" aria-pressed="true">notice</button>
            <button data-kind="request" aria-pressed="false">request</button>
            <button data-kind="info" aria-pressed="false">info</button>
          </div>
          <div class="kindhint" id="kindHint"></div>
        </div>
        <textarea id="msg" placeholder="write to the sessions…"></textarea>
        <div class="sendrow">
          <button class="btn primary" id="sendBtn" onclick="send()"><span>Send</span><span class="to" id="sendTo">notice → @all</span></button>
          <div class="kbd">ctrl/⌘ + enter</div>
        </div>
        <div class="control">
          <button class="btn" id="haltBtn" onclick="haltSel()">⏸ halt @all</button>
          <button class="btn" id="resumeBtn" onclick="resumeSel()">▶ resume @all</button>
        </div>
      </div>
      <div class="sessions">
        <div class="sec-h"><h2>Sessions</h2><span class="n" id="liveCount"></span></div>
        <div id="sessions"></div>
      </div>
      <div class="foot">
        <button class="btn ghost" onclick="testPush()">send test push</button>
        <button class="btn ghost" onclick="logout()">sign out</button>
      </div>
    </aside>
  </main>
  <div id="telem" hidden>
    <div class="tfilters">
      <div class="seg" id="tRange">
        <button data-h="1" aria-pressed="false">1h</button><button data-h="6" aria-pressed="false">6h</button>
        <button data-h="24" aria-pressed="true">24h</button><button data-h="168" aria-pressed="false">7d</button>
      </div>
      <span class="upd" id="tUpd"></span>
    </div>
    <div id="telemBody"><div class="empty">loading telemetry…</div></div>
  </div>
</div>
<div id="tip"></div>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let state = null, events = [], es = null, pubKey = null;
const OP = () => (state && state.operator) || "operator";
window.orcState = () => state;  // telemetry.js reads presence from here
const drafts = {};
const compose = { to: "@all", kind: "notice" };
const KIND_HINT = {
  notice: "pushed into the session as a turn; carries your authority",
  request: "pushed; asks for a reply; answers collect under Your requests",
  info: "pushed; context for the sessions, no reply expected",
};

function store(k, v) { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
function recall(k) { try { return localStorage.getItem(k); } catch { return null; } }
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2600); }

async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: "same-origin", headers: { "content-type": "application/json" }, ...opts });
  if (r.status === 401) { showLogin(); throw new Error("signed out"); }
  if (!r.ok) { let d = r.statusText; try { d = (await r.json()).detail || d; } catch {} throw new Error(d); }
  return r.json();
}
const post = (body) => api("/api/events", { method: "POST", body: JSON.stringify({ from: "operator", ...body }) });

function showLogin() { $("#app").hidden = true; $("#login").hidden = false; if (es) es.close(); }
async function login(e) {
  e.preventDefault();
  try { await api("/api/login", { method: "POST", body: JSON.stringify({ token: $("#tok").value.trim() }) }); $("#tok").value = ""; boot(); }
  catch (err) { toast("sign-in failed: " + err.message); }
}
async function logout() { await api("/api/logout", { method: "POST" }); showLogin(); }

// ---- theme: follow the system, or pin one; stored per device ----
function applyTheme() { const t = recall("orc-theme"); if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
function cycleTheme() {
  const cur = recall("orc-theme");
  const next = cur === null ? (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark") : null;
  store("orc-theme", next ?? undefined); applyTheme(); toast(next ? `${next} theme` : "following system theme");
}

// ---- time ----
const hhmm = (iso) => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago"; return Math.floor(s / 86400) + "d ago";
}
function left(iso) {
  const s = Math.round((new Date(iso) - Date.now()) / 1000);
  if (s <= 0) return "defaulting…";
  const m = Math.floor(s / 60), h = Math.floor(m / 60);
  return (h ? `${h}h ${m % 60}m` : m ? `${m}m ${String(s % 60).padStart(2, "0")}s` : `${s}s`) + " to default";
}
function tickCountdowns() {
  document.querySelectorAll(".countdown").forEach((el) => {
    el.textContent = left(el.dataset.deadline);
    el.classList.toggle("soon", new Date(el.dataset.deadline) - Date.now() < 10 * 60 * 1000);
  });
}

// ---- inbox ----
// Picks on option cards survive re-renders (they live here, not in the DOM).
const picks = {};
function optionsBlock(t, closed) {
  if (!t.options || !t.options.length) return "";
  const sel = closed ? new Set(t.choice || []) : (picks[t.id] || new Set());
  const rows = t.options.map((o) => {
    const on = sel.has(o.label);
    const mk = t.multi ? (on ? "[x]" : "[ ]") : (on ? "(•)" : "( )");
    const badges = (o.recommended ? `<span class="badge rec">recommended</span>` : "")
      + (t.kind === "ask" && t.default === o.label ? `<span class="badge">default</span>` : "");
    return `<button class="opt${closed ? " closed" : ""}" data-t="${esc(t.id)}" data-label="${esc(o.label)}" aria-pressed="${on}"${closed ? " disabled" : ""}>
      <span class="mk">${mk}</span><span><span class="ol">${esc(o.label)}</span>${badges}</span>${o.description ? `<span class="od">${esc(o.description)}</span>` : ""}</button>`;
  }).join("");
  const hint = closed ? "" : `<span class="hint">${t.multi ? "pick any" : "pick one"}, or answer in your own words</span>`;
  return `<div class="opts">${hint}${rows}</div>`;
}
function discussion(t) {
  const items = (t.answers || []).filter((a) => a.kind === "reply");
  if (!items.length) return "";
  return `<div class="disc">${items.map((a) => `<div class="d${a.from === OP() ? " op" : ""}"><span class="who">${a.from === OP() ? "you" : esc(a.from)}</span><span class="when">${a.ts ? ago(a.ts) : ""}</span><div class="txt">${esc(a.body)}</div></div>`).join("")}</div>`;
}
function threadCard(t, closed) {
  const k = t.kind;
  const topic = t.topic ? `<span>#${esc(t.topic)}</span>` : "";
  let extra = t.context ? `<div class="ctx">${esc(t.context)}</div>` : "";
  extra += optionsBlock(t, closed);
  if (k === "ask") {
    extra += `<div class="dflt"><span class="k">default</span><span><b>${esc(t.default)}</b></span>${t.revert_cost ? `<span class="k">revert</span><span>${esc(t.revert_cost)}</span>` : ""}</div>`;
    if (!closed) extra += `<span class="countdown" data-deadline="${esc(t.deadline)}">${left(t.deadline)}</span>`;
  }
  let foot;
  if (!closed) {
    const hasOpts = t.options && t.options.length;
    const ph = k === "note" ? "reply (optional)…" : hasOpts ? "comment, or your own answer instead…" : "your answer…";
    foot = `<div class="reply">
      <textarea data-draft="${t.id}" rows="2" placeholder="${ph}">${esc(drafts[t.id] || "")}</textarea>
      <div class="row">
        <button class="btn primary" onclick="answer('${t.id}')">${k === "note" ? "reply" : hasOpts ? "send answer" : "answer"}</button>
        ${k === "ask" ? `<button class="btn" onclick="takeDefault('${t.id}')">take default</button>` : ""}
        ${k !== "note" ? `<button class="btn" onclick="askMore('${t.id}')" title="sends your text to ${esc(t.from)} and keeps this open">ask for more info</button>` : ""}
        <span class="spacer"></span>
        <button class="btn ghost" onclick="ack('${t.id}')">${k === "note" ? "seen" : "ack"}</button>
      </div></div>`;
  } else {
    foot = `<div class="res"><b>${esc(t.status)}</b>${t.choice && t.choice.length ? " · " + t.choice.map(esc).join(", ") : ""}${t.resolution ? " · " + esc(t.resolution) : ""} · ${ago(t.resolved_at || t.ts)}</div>`;
  }
  return `<div class="card ${k}${closed ? " done" : ""}" id="t-${t.id}">
    <div class="meta"><span class="tag ${k}">${k}</span><span class="who">${esc(t.from)}</span>${topic}<span>${ago(t.ts)}</span><span class="id idlink" data-id="${t.id}">${t.id}</span></div>
    <div class="body">${esc(t.body)}</div>${extra}${discussion(t)}${foot}</div>`;
}
// Re-rendering replaces nodes: that drops focus from a box being typed in and removes the
// node the browser anchors scrolling to. So: don't rebuild the inbox while it's being typed
// in (catch up on focusout), and if a rebuild elsewhere eats the focused field, put it back.
let inboxStale = false;
const typingInInbox = () => !!(document.activeElement && document.activeElement.closest("#inbox textarea"));
function keepFocus(fn) {
  const a = document.activeElement;
  const key = a && (a.dataset && a.dataset.draft ? `textarea[data-draft="${a.dataset.draft}"]`
    : a.dataset && a.dataset.redraft ? `textarea[data-redraft="${a.dataset.redraft}"]` : a.id ? "#" + a.id : null);
  const sel = a && typeof a.selectionStart === "number" ? [a.selectionStart, a.selectionEnd] : null;
  fn();
  if (a && key && !document.contains(a)) {
    const n = document.querySelector(key);
    if (n) { n.focus({ preventScroll: true }); if (sel && n.setSelectionRange) n.setSelectionRange(sel[0], sel[1]); }
  }
}
function renderCounts() {
  const open = state.inbox.open;
  const asks = open.filter((t) => t.kind === "ask").length;
  $("#openCount").textContent = open.length ? `${open.length} open${asks ? ` · ${asks} ask${asks > 1 ? "s" : ""}` : ""}` : "";
  $("#tabInbox").textContent = open.length ? `(${open.length})` : "";
  document.title = open.length ? `(${open.length}) orchestra` : "orchestra";
}
function renderInbox() {
  renderCounts();
  if (typingInInbox()) { inboxStale = true; return; }
  inboxStale = false;
  keepFocus(renderInboxNow);
}
const INBOX_SORT = {
  urgent: null,  // server order: asks by deadline, then the rest by age
  new: (a, b) => b.ts.localeCompare(a.ts),
  old: (a, b) => a.ts.localeCompare(b.ts),
  who: (a, b) => a.from.localeCompare(b.from) || (a.kind === "ask" ? -1 : 0) - (b.kind === "ask" ? -1 : 0) || a.ts.localeCompare(b.ts),
};
function renderInboxNow() {
  const cmp = INBOX_SORT[$("#inboxSort").value];
  const open = cmp ? [...state.inbox.open].sort(cmp) : state.inbox.open, closed = state.inbox.closed;
  $("#open").innerHTML = open.length ? open.map((t) => threadCard(t, false)).join("") : `<div class="empty">inbox zero — everyone's cooking</div>`;
  $("#closed").innerHTML = closed.map((t) => threadCard(t, true)).join("") || `<div class="empty">nothing yet</div>`;
  renderSent();
  tickCountdowns(); flashHash();
}
// Each response to one of your requests can be replied to directly; the reply is
// addressed to that session (so it's pushed to it) and refs the response it answers.
const openReplies = new Set();
function answerBlock(a) {
  const mine = events.filter((e) => e.from === OP() && e.ref && e.ref === a.id)
    .map((e) => `<div class="mine"><span class="who">you</span> <span class="when">${ago(e.ts)}</span><div class="txt">${esc(e.body)}</div></div>`).join("");
  const box = a.id && openReplies.has(a.id)
    ? `<div class="reply"><textarea data-redraft="${esc(a.id)}" data-to="${esc(a.from)}" rows="2" placeholder="reply to ${esc(a.from)}…">${esc(drafts["re-" + a.id] || "")}</textarea>
       <div class="row"><button class="btn primary" onclick="replyTo('${esc(a.id)}','${esc(a.from)}')">send → @${esc(a.from)}</button><span class="spacer"></span><button class="btn ghost" onclick="toggleReply('${esc(a.id)}')">cancel</button></div></div>`
    : a.id ? `<div class="ansact"><button class="mini" onclick="toggleReply('${esc(a.id)}')">reply to ${esc(a.from)}</button></div>` : "";
  return `<div class="ans"><span class="who">${esc(a.from)}</span><span class="when">${a.kind === "reply" ? "reply · " : ""}${a.ts ? ago(a.ts) : ""}</span>${a.id ? `<span class="when idlink" data-id="${esc(a.id)}">${esc(a.id)}</span>` : ""}<div class="txt">${esc(a.body)}</div>${mine}${box}</div>`;
}
function toggleReply(id) {
  openReplies.has(id) ? openReplies.delete(id) : openReplies.add(id);
  renderInboxNow();
  const ta = document.querySelector(`textarea[data-redraft="${id}"]`); if (ta) ta.focus({ preventScroll: true });
}
async function replyTo(id, to) {
  const body = (drafts["re-" + id] || "").trim();
  if (!body) return toast("write a reply first");
  try {
    await post({ kind: "reply", to: "@" + to, ref: id, body });
    delete drafts["re-" + id]; openReplies.delete(id);
    toast(`reply sent → @${to}`);
    setTimeout(() => state && renderInboxNow(), 400);  // let the event arrive so "you:" shows
  } catch (e) { toast("failed: " + e.message); }
}
function sentCard(t) {
  const answers = (t.answers && t.answers.length) ? t.answers
    : (t.status === "answered" ? [{ from: t.resolved_by, body: t.resolution, ts: t.resolved_at }] : []);
  const list = answers.length
    ? answers.map(answerBlock).join("")
    : `<div class="waiting">no answers yet</div>`;
  const open = t.status === "open";
  const tail = open ? `<div class="reply"><div class="row"><span class="spacer"></span><button class="btn" onclick="ack('${t.id}')">close</button></div></div>`
    : `<div class="res"><b>${esc(t.status)}</b> · ${ago(t.resolved_at || t.ts)}</div>`;
  return `<div class="card request sent${open ? "" : " done"}" id="t-${t.id}">
    <div class="meta"><span class="tag">${esc(t.kind)}</span><span class="who">→ ${esc(t.to)}</span><span>${ago(t.ts)}</span><span>${answers.length} answer${answers.length === 1 ? "" : "s"}</span><span class="id idlink" data-id="${t.id}">${t.id}</span></div>
    <div class="body">${esc(t.body)}</div>${list}${tail}</div>`;
}
function renderSent() {
  const sent = state.inbox.sent || [];
  const open = sent.filter((t) => t.status === "open").length;
  $("#sentCount").textContent = sent.length ? `${open} open` : "";
  $("#sent").innerHTML = sent.length ? sent.map(sentCard).join("") : `<div class="empty">send a request from the desk and answers collect here</div>`;
}
async function closeThread(kind, id, body, extra = {}) {
  try { await post({ kind, ref: id, body, ...extra }); delete drafts[id]; delete picks[id]; await refresh(); toast(kind === "answer" ? "sent" : "closed"); }
  catch (e) { toast("failed: " + e.message); }
}
function answer(id) {
  const body = (drafts[id] || "").trim();
  const t = state.inbox.open.find((x) => x.id === id);
  const chosen = t && t.options ? t.options.map((o) => o.label).filter((l) => picks[id] && picks[id].has(l)) : [];
  if (chosen.length) return closeThread("answer", id, body, { choice: chosen });
  if (!body) { if (t && t.kind === "note") return ack(id); return toast(t && t.options ? "pick an option or write an answer" : "write an answer first"); }
  closeThread("answer", id, body);
}
function takeDefault(id) {
  const t = state.inbox.open.find((x) => x.id === id);
  if (t && t.options) return closeThread("answer", id, "took the default", { choice: [t.default] });
  closeThread("answer", id, `take the default: ${t ? t.default : ""}`);
}
async function askMore(id) {
  const body = (drafts[id] || "").trim();
  const t = state.inbox.open.find((x) => x.id === id);
  if (!body) { toast("write what you'd like to know"); const ta = document.querySelector(`textarea[data-draft="${id}"]`); if (ta) ta.focus({ preventScroll: true }); return; }
  try {
    await post({ kind: "reply", to: "@" + (t ? t.from : "all"), ref: id, body });
    delete drafts[id]; await refresh(); toast(`asked ${t ? t.from : ""} for more · still open`);
  } catch (e) { toast("failed: " + e.message); }
}
// option rows: toggle the pick in place, no re-render
$("#inbox").addEventListener("click", (e) => {
  const b = e.target.closest(".opt"); if (!b || b.disabled) return;
  const t = state.inbox.open.find((x) => x.id === b.dataset.t); if (!t) return;
  const set = picks[t.id] || (picks[t.id] = new Set());
  const label = b.dataset.label;
  if (t.multi) set.has(label) ? set.delete(label) : set.add(label);
  else { const was = set.has(label); set.clear(); if (!was) set.add(label); }
  b.closest(".opts").querySelectorAll(".opt").forEach((x) => {
    const on = set.has(x.dataset.label);
    x.setAttribute("aria-pressed", on);
    x.querySelector(".mk").textContent = t.multi ? (on ? "[x]" : "[ ]") : (on ? "(•)" : "( )");
  });
});
function ack(id) { closeThread("ack", id, (drafts[id] || "").trim()); }

// ---- bus ----
function evRow(e) {
  const ref = e.ref ? `<span class="idlink" data-id="${esc(e.ref)}">re ${esc(e.ref)}</span>` : "";
  const topic = e.topic ? `<span>#${esc(e.topic)}</span>` : "";
  const extra = e.kind === "ask" ? `\n→ default: ${e.default}` : "";
  const cls = [e.kind, e.from === OP() ? "op" : ""].join(" ");
  return `<div class="ev ${esc(cls)}" data-from="${esc(e.from)}" title="click to address ${esc(e.from)}">
    <div class="ts" title="${esc(e.ts)}">${hhmm(e.ts)}</div>
    <div><div class="head"><b>${esc(e.from)}</b><span>→ ${esc(e.to)}</span><span class="k">${esc(e.kind)}</span><span class="idlink" data-id="${esc(e.id)}">${esc(e.id)}</span>${ref}${topic}<span class="re">↩ address</span></div>
    <div class="txt">${esc(e.body)}${esc(extra)}</div></div></div>`;
}
const feedShows = (e) => (!$("#hideStatus").checked || e.kind !== "status") && (!$("#onlyMine").checked || e.from === OP() || e.to === "@" + OP());
let newestFirst = recall("orc-feed-order") !== "old";
let searchQ = "", searchTimer = null;
function prependEvent(e) {
  if (searchQ) { scheduleSearch(); return; }
  if (!feedShows(e)) return;
  const box = $("#events");
  const empty = box.querySelector(".empty"); if (empty) empty.remove();
  box.insertAdjacentHTML(newestFirst ? "afterbegin" : "beforeend", evRow(e));
  while (box.children.length > 300) (newestFirst ? box.lastElementChild : box.firstElementChild).remove();
}
function renderFeed() {
  $("#feedOrder").textContent = newestFirst ? "newest first" : "oldest first";
  if (searchQ) return runSearch();
  $("#searchNote").hidden = true;
  const shown = events.filter(feedShows).slice(-300);
  if (newestFirst) shown.reverse();
  $("#events").innerHTML = shown.map(evRow).join("") || `<div class="empty">quiet bus</div>`;
}
function scheduleSearch() { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 250); }
async function runSearch() {
  const q = searchQ;
  if (!q) return renderFeed();
  try {
    const r = await api(`/api/search?q=${encodeURIComponent(q)}&limit=300`);
    if (q !== searchQ) return;  // a newer query is in flight
    const hits = r.events.filter(feedShows);
    if (!newestFirst) hits.reverse();
    $("#events").innerHTML = hits.map(evRow).join("") || `<div class="empty">nothing matches “${esc(q)}”</div>`;
    const note = $("#searchNote");
    note.innerHTML = `<span>${hits.length} match${hits.length === 1 ? "" : "es"} for “${esc(q)}”</span><button class="mini" onclick="setSearch('')">clear</button>`;
    note.hidden = false;
    // an id that names an inbox thread: point at it there too
    const card = document.getElementById("t-" + q.replace(/^#/, ""));
    if (card) { card.classList.add("flash"); setTimeout(() => card.classList.remove("flash"), 2500); }
  } catch (e) { toast("search failed: " + e.message); }
}
function setSearch(q) {
  searchQ = q.trim(); $("#q").value = searchQ;
  if (searchQ && matchMedia("(max-width: 820px)").matches) showTab("feed");
  renderFeed();
}
$("#q").addEventListener("input", () => { searchQ = $("#q").value.trim(); searchQ ? scheduleSearch() : renderFeed(); });
$("#q").addEventListener("keydown", (e) => { if (e.key === "Escape") setSearch(""); });
$("#feedOrder").onclick = () => { newestFirst = !newestFirst; store("orc-feed-order", newestFirst ? undefined : "old"); renderFeed(); };
$("#inboxSort").value = recall("orc-inbox-sort") || "urgent";
$("#inboxSort").onchange = () => { store("orc-inbox-sort", $("#inboxSort").value); if (state) keepFocus(renderInboxNow); };
document.addEventListener("click", (e) => {
  const l = e.target.closest(".idlink"); if (!l) return;
  e.stopPropagation(); e.preventDefault(); setSearch(l.dataset.id);
}, true);
$("#events").addEventListener("click", (e) => {
  const row = e.target.closest(".ev"); if (!row) return;
  const from = row.dataset.from;
  if (from && from !== OP() && from !== "orchestra") { setTo("@" + from); focusCompose(); }
});

// ---- sessions + compose ----
function renderSessions() {
  // live first, then away (most recently seen first); away sessions stay addressable: messages wait for them
  const ps = [...state.presence].sort((a, b) => (b.live - a.live) || b.last_seen.localeCompare(a.last_seen));
  const live = ps.filter((p) => p.live);
  const recent = ps.filter((p) => p.live || Date.now() - new Date(p.last_seen) < 3 * 86400e3);
  $("#liveCount").textContent = `${live.length} live${ps.length > live.length ? ` · ${ps.length - live.length} away` : ""}`;
  const status = (p) => p.live ? (p.channel ? esc(p.status || "") : "no push")
    : `away ${ago(p.last_seen).replace(" ago", "")}${p.waiting ? ` · <b>${p.waiting} waiting</b>` : ""}`;
  $("#sessions").innerHTML = ps.length ? ps.map((p) => `<div class="sess${p.live ? "" : " off"}" data-h="${esc(p.handle)}" title="${esc(p.cwd || "")}${p.live ? "" : " · messages to it are held until it's back"}">
      <span class="dot ${p.live ? "on" : ""}"></span><span class="h">${esc(p.handle)}${p.usage && p.usage.context ? ` <span class="st">· ${fmtCtx(p.usage.context)} ctx</span>` : ""}</span>
      ${p.bridge && p.live ? `<a class="rc" href="https://claude.ai/code/${encodeURIComponent(p.bridge)}" target="_blank" rel="noopener" title="open this session in the Claude app (Remote Control): /compact, /context, /model work there">open ↗</a>` : "<span></span>"}
      <span class="st">${p.live && state.client_build && p.build !== state.client_build ? `<span class="stale" title="running older orchestra code (${esc(p.build || "pre-build")}); in that session run /mcp reconnect orchestra (works from the Claude app too)">reconnect</span> ` : ""}${status(p)}</span></div>`).join("")
    : `<div class="empty">no sessions have checked in</div>`;
  document.querySelectorAll(".sess").forEach((el) => (el.onclick = (e) => { if (e.target.closest("a")) return; setTo("@" + el.dataset.h); focusCompose(); }));
  $("#toChips").innerHTML = [`<button class="chip" data-to="@all">@all</button>`]
    .concat(recent.map((p) => {
      const cls = !p.live ? " away" : p.channel ? "" : " np";
      const title = !p.live ? "away: this will be held and delivered when it's back" : p.channel ? "" : "no push lane: launched without the channel flag";
      return `<button class="chip${cls}" data-to="@${esc(p.handle)}"${title ? ` title="${title}"` : ""}>@${esc(p.handle)}${p.live ? "" : " · away"}</button>`;
    })).join("");
  document.querySelectorAll("#toChips .chip").forEach((c) => (c.onclick = () => setTo(c.dataset.to)));
  paintCompose();
  const pushOk = state.push && state.push.subscriptions > 0;
  $("#meta").innerHTML = `<span>${live.length} live</span><span class="wide"> · bus #${state.head}</span><span> · push ${pushOk ? "on" : "off"}</span>`;
}
const fmtCtx = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "K" : String(n);
function setTo(to) { compose.to = to; paintCompose(); }
function setKind(k) { compose.kind = k; paintCompose(); }
function paintCompose() {
  const chips = [...document.querySelectorAll("#toChips .chip")];
  if (chips.length && !chips.some((c) => c.dataset.to === compose.to)) compose.to = "@all";  // recipient went away
  chips.forEach((c) => c.setAttribute("aria-pressed", c.dataset.to === compose.to));
  document.querySelectorAll("#kindSeg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.kind === compose.kind));
  $("#kindHint").textContent = KIND_HINT[compose.kind];
  $("#sendTo").textContent = `${compose.kind} → ${compose.to}`;
  $("#haltBtn").textContent = `⏸ halt ${compose.to}`;
  $("#resumeBtn").textContent = `▶ resume ${compose.to}`;
}
function focusCompose() {
  if (matchMedia("(max-width: 820px)").matches) showTab("side");
  $("#msg").focus();
}
document.querySelectorAll("#kindSeg button").forEach((b) => (b.onclick = () => setKind(b.dataset.kind)));
async function send() {
  const body = $("#msg").value.trim(); if (!body) { $("#msg").focus(); return toast("nothing to send"); }
  $("#sendBtn").disabled = true;
  try { await post({ to: compose.to, kind: compose.kind, body }); $("#msg").value = ""; store("orc-draft"); const away = state.presence.find((p) => "@" + p.handle === compose.to && !p.live);
    toast(away ? `${compose.kind} queued for ${compose.to}: delivered when it\u2019s back` : `${compose.kind} sent → ${compose.to}`); }
  catch (e) { toast("failed: " + e.message); }
  finally { $("#sendBtn").disabled = false; }
}
async function haltSel() {
  const why = prompt(`Halt ${compose.to}? Reason (optional):`, ""); if (why === null) return;
  try { await post({ to: compose.to, kind: "halt", body: why }); toast(`halt → ${compose.to}`); } catch (e) { toast(e.message); }
}
async function resumeSel() {
  const msg = prompt(`Resume ${compose.to}. Message (optional):`, ""); if (msg === null) return;
  try { await post({ to: compose.to, kind: "resume", body: msg }); toast(`resume → ${compose.to}`); } catch (e) { toast(e.message); }
}
$("#msg").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send(); });
$("#msg").addEventListener("input", () => store("orc-draft", $("#msg").value));

// ---- push ----
function b64ToBytes(b64) { const p = "=".repeat((4 - (b64.length % 4)) % 4); const raw = atob((b64 + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(raw, (c) => c.charCodeAt(0)); }
const swReg = () => navigator.serviceWorker.register("/sw.js", { scope: "/" });
async function enablePush() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return toast("this browser can't do web push");
  if (!pubKey) return toast("server has no push key");
  try {
    if ((await Notification.requestPermission()) !== "granted") return toast("notifications not allowed");
    const reg = await swReg();
    const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(pubKey) }));
    await api("/api/push/subscribe", { method: "POST", body: JSON.stringify(sub.toJSON()) });
    toast("push on for this device"); updatePushBtn(); refresh();
  } catch (e) { toast("push failed: " + e.message); }
}
async function updatePushBtn() {
  const btn = $("#pushBtn");
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) { btn.hidden = true; return; }
  const reg = await navigator.serviceWorker.getRegistration("/");
  const sub = reg && (await reg.pushManager.getSubscription());
  btn.textContent = sub && Notification.permission === "granted" ? "push on" : "enable push";
}
async function testPush() { try { const r = await api("/api/push/test", { method: "POST" }); toast(`test push → ${r.delivered} device(s)`); } catch (e) { toast(e.message); } }

// ---- live ----
async function refresh() { state = await api("/api/state"); pubKey = state.push && state.push.public_key; renderInbox(); keepFocus(renderSessions); }
function connect() {
  if (es) es.close();
  const after = events.length ? events[events.length - 1].seq : state.head;
  es = new EventSource(`/api/stream?after=${after}`);
  es.addEventListener("bus", (m) => {
    const e = JSON.parse(m.data);
    if (events.length && e.seq <= events[events.length - 1].seq) return;
    events.push(e); if (events.length > 1000) events.splice(0, events.length - 1000); prependEvent(e);
    if (["ask", "request", "note", "answer", "ack", "defaulted", "withdraw", "reply"].includes(e.kind)) refresh();
    else state.head = e.seq;
  });
  es.onopen = () => $("#live").classList.add("on");
  es.onerror = () => $("#live").classList.remove("on");
}
function flashHash() {
  const q = location.hash.match(/q=([\w-]+)/);  // permalinks: /m/<id> redirects to /#q=<id>
  if (q) { history.replaceState(null, "", location.pathname); setSearch(q[1]); return; }
  const m = location.hash.match(/t=([\w-]+)/); if (!m) return;
  const el = document.getElementById("t-" + m[1]); if (!el) return;
  showTab("inbox"); el.classList.add("flash"); el.scrollIntoView({ block: "center" }); setTimeout(() => el.classList.remove("flash"), 2500);
  history.replaceState(null, "", location.pathname);
}
function showTab(id) {
  document.querySelectorAll("nav.tabs button").forEach((x) => x.classList.toggle("active", x.dataset.tab === id));
  if (id === "telem") return setView("telem");
  setView("desk");
  document.querySelectorAll("main > section, main > aside").forEach((s) => s.classList.toggle("active", s.id === id));
}
function setView(v) {
  const telem = v === "telem";
  $("main").hidden = telem; $("#telem").hidden = !telem;
  $("#viewBtn").textContent = telem ? "desk" : "telemetry";
  if (telem) { window.Telem && Telem.show(); } else { window.Telem && Telem.hide(); }
}
function toggleView() {
  const toTelem = $("#telem").hidden;
  if (matchMedia("(max-width: 820px)").matches) return showTab(toTelem ? "telem" : "inbox");
  setView(toTelem ? "telem" : "desk");
}
document.querySelectorAll("nav.tabs button").forEach((b) => (b.onclick = () => showTab(b.dataset.tab)));
$("#hideStatus").onchange = renderFeed; $("#onlyMine").onchange = renderFeed;
// One delegated listener per event for every inbox text box, including ones drawn later.
$("#inbox").addEventListener("input", (e) => {
  const ta = e.target;
  if (ta.dataset.draft) drafts[ta.dataset.draft] = ta.value;
  else if (ta.dataset.redraft) drafts["re-" + ta.dataset.redraft] = ta.value;
});
$("#inbox").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || !(e.ctrlKey || e.metaKey)) return;
  const ta = e.target;
  if (ta.dataset.draft) answer(ta.dataset.draft);
  else if (ta.dataset.redraft) replyTo(ta.dataset.redraft, ta.dataset.to);
});
$("#inbox").addEventListener("focusout", () => setTimeout(() => { if (inboxStale && !typingInInbox() && state) renderInbox(); }, 0));

async function boot() {
  try { await refresh(); } catch { return; }
  $("#login").hidden = true; $("#app").hidden = false;
  const draft = recall("orc-draft"); if (draft && !$("#msg").value) $("#msg").value = draft;
  const d = await api(`/api/events?after=${Math.max(0, state.head - 300)}&limit=300`);
  events = d.events; renderFeed(); connect(); updatePushBtn(); flashHash();
  if ("serviceWorker" in navigator) swReg().catch(() => {});
}
applyTheme();
setInterval(tickCountdowns, 1000);
setInterval(() => { if (state) refresh().catch(() => {}); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && state) refresh().catch(() => {}); });
window.addEventListener("hashchange", flashHash);
boot();
</script>
