<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>orchestra</title>
<meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Grayscale typewriter. Hierarchy comes from weight, inversion, rules and hatching, not hue.
   A deployment can restyle via /brand.css (loaded last): override --f-body / --f-display, add @font-face.
   Layout: an app shell. Header, then three ruled columns (roster | bus + composer | inbox), each its own
   scroll, so nothing is ever reached by scrolling something else. Phones get the same panes as tabs. */
:root {
  --bg: #ffffff; --surface: #ffffff; --surface2: #f3f4f6; --fg: #0b0c0e; --muted: #5a626d; --faint: #6f7781;
  --line: #d5d9de; --rule: #0b0c0e; --hatch: #c9ced5; --chip: #f3f4f6; --shadow: 0 10px 40px rgba(11,12,14,.14);
  --f-body: "Courier Prime", "Courier New", ui-monospace, monospace;
  --f-display: var(--f-body);
  --gutter: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0c0e; --surface: #0b0c0e; --surface2: #15181c; --fg: #f2f3f5; --muted: #9aa3ad; --faint: #7d8590;
  --line: #2b3038; --rule: #f2f3f5; --hatch: #39404a; --chip: #15181c; --shadow: 0 10px 40px rgba(0,0,0,.6);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b0c0e; --surface: #0b0c0e; --surface2: #15181c; --fg: #f2f3f5; --muted: #9aa3ad; --faint: #7d8590;
  --line: #2b3038; --rule: #f2f3f5; --hatch: #39404a; --chip: #15181c; --shadow: 0 10px 40px rgba(0,0,0,.6);
  color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
button, textarea, select, input { font: inherit; color: inherit; }
a { color: var(--fg); text-decoration-thickness: 1px; text-underline-offset: 2px; }
::selection { background: var(--fg); color: var(--bg); }
:focus-visible { outline: 1px solid var(--fg); outline-offset: 2px; }

/* buttons: primary is inverted, secondary is ruled, ghost is text */
.btn { background: transparent; border: 1px solid var(--fg); color: var(--fg); padding: 7px 14px; cursor: pointer; border-radius: 2px; letter-spacing: .02em; }
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--fg); color: var(--bg); font-weight: 700; }
.btn.primary:hover { opacity: .88; background: var(--fg); }
.btn.ghost { border-color: transparent; color: var(--muted); padding: 7px 8px; }
.btn.ghost:hover { color: var(--fg); background: transparent; text-decoration: underline; }
.btn:disabled { opacity: .4; cursor: default; }
textarea, input[type=password] {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 10px 12px; resize: vertical;
}
textarea:focus, input:focus { border-color: var(--fg); outline: none; }
.lbl { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.spacer { flex: 1; }

/* ---- shell ---- */
#app { height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
header.top {
  border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 18px; min-width: 0;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(var(--gutter), env(safe-area-inset-right, 0px)) 10px max(var(--gutter), env(safe-area-inset-left, 0px));
}
.wordmark { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .01em; margin: 0; }
.eyebrow { display: flex; gap: 10px; align-items: center; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; min-width: 0; }
.dot { width: 8px; height: 8px; border: 1px solid var(--fg); display: inline-block; border-radius: 50%; flex: none; }
.dot.on { background: var(--fg); }

nav.tabs { display: none; border-bottom: 1px solid var(--line); padding: 0 calc(var(--gutter) - 4px); }
nav.tabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 11px 4px; cursor: pointer; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-size: 13px; min-height: 44px; }
nav.tabs button.active { color: var(--fg); border-bottom-color: var(--fg); font-weight: 700; }

main { display: grid; grid-template-columns: clamp(210px, 16vw, 264px) minmax(0, 1.35fr) minmax(0, 1fr); min-height: 0; max-width: 1920px; width: 100%; margin: 0 auto; }
.pane { min-width: 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 18px 20px 40px; }
.pane + .pane { border-left: 1px solid var(--line); }
.sec-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.sec-h h2 { font-family: var(--f-display); font-size: 15px; letter-spacing: .14em; text-transform: uppercase; margin: 0; }
.sec-h .n { font-size: 13px; color: var(--muted); white-space: nowrap; }
.sec-h .tools { margin-left: auto; display: flex; gap: 12px; font-size: 12.5px; color: var(--muted); align-items: center; }
.sec-h .tools label { display: flex; gap: 5px; align-items: center; cursor: pointer; white-space: nowrap; }
.sec-h .tools input { accent-color: var(--fg); }
.empty { color: var(--faint); padding: 26px 12px; text-align: center; border: 1px dashed var(--line); }

/* ---- roster: the sessions are the address book ---- */
#roster { display: flex; flex-direction: column; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: 14px; }
#roster .list { flex: 1; }
.who { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; column-gap: 6px; align-items: baseline; width: 100%; text-align: left;
  background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 7px 6px; cursor: pointer; color: var(--fg); }
.who:hover { background: var(--surface2); }
.who .g { font-size: 13px; line-height: 1; text-align: center; }
.who .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .sub { grid-column: 2 / -1; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); min-width: 0; white-space: nowrap; overflow: hidden; }
.who .sub .s { overflow: hidden; text-overflow: ellipsis; }
.who .meter { flex: none; width: 44px; height: 4px; border: 1px solid var(--muted); position: relative; }
.who .meter i { position: absolute; inset: 0 auto 0 0; background: var(--muted); }
.who .meter.hot { border-color: var(--fg); } .who .meter.hot i { background: var(--fg); }
.who .acts { display: flex; gap: 4px; }
.who .act { font-size: 12px; color: var(--muted); border: 1px solid var(--line); padding: 0 5px; background: var(--surface); cursor: pointer; text-decoration: none; white-space: nowrap; line-height: 1.5; }
.who .act:hover { color: var(--fg); border-color: var(--fg); }
.who .stale { border: 1px dashed var(--fg); color: var(--fg); padding: 0 4px; }
.who.off .nm { font-weight: 400; color: var(--muted); }
.who.all { border-bottom: 1px solid var(--rule); margin-bottom: 4px; }
.who.all .nm { letter-spacing: .06em; }
/* selected: inverted, like a key held down */
.who[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.who[aria-pressed="true"] .sub, .who[aria-pressed="true"] .nm { color: var(--bg); }
.who[aria-pressed="true"] .meter { border-color: var(--bg); } .who[aria-pressed="true"] .meter i { background: var(--bg); }
.who[aria-pressed="true"] .act { background: var(--fg); color: var(--bg); border-color: var(--bg); }
.rgroup { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin: 14px 6px 2px; }
.rfoot { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.rfoot .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.rfoot .two .btn { font-size: 13px; padding: 6px 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rfoot .meta { display: flex; flex-wrap: wrap; gap: 0 4px; font-size: 12.5px; }
.rfoot .meta .btn { padding: 4px 6px; }
#writeBtn { display: none; }

/* ---- bus + composer ---- */
#feed { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 0; }
#feed .scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; margin: 0 -8px; padding: 0 8px; }
.search { display: flex; gap: 8px; margin: 0 0 8px; }
.search input { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 7px 10px; }
.search input:focus { border-color: var(--fg); outline: none; }
.searchnote { font-size: 12.5px; color: var(--muted); margin: 0 0 8px; display: flex; gap: 10px; align-items: baseline; }
.ev { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 14px; cursor: pointer; }
.ev:hover { background: var(--surface2); }
.ev .ts { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12.5px; padding-top: 1px; white-space: nowrap; }
.ev .head { color: var(--muted); font-size: 13px; display: flex; gap: 4px 8px; flex-wrap: wrap; align-items: baseline; min-width: 0; }
.ev .head .nm { color: var(--fg); font-weight: 700; cursor: pointer; }
.ev .head .nm:hover { text-decoration: underline; }
.ev .head .rcpt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.ev .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; border: 1px solid var(--line); padding: 0 5px; }
.ev .txt { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; line-clamp: 5; overflow: hidden; }
.ev.open .txt { display: block; -webkit-line-clamp: unset; }
.ev .more { display: none; font-size: 12px; color: var(--muted); margin-top: 2px; }
.ev.long .more { display: inline-block; } .ev.open .more { display: inline-block; }
.ev.status .txt { color: var(--muted); }
.ev.op .head .nm { text-decoration: underline; text-underline-offset: 3px; }
.ev.ask, .ev.halt { border-left: 6px solid transparent; border-image: repeating-linear-gradient(135deg, var(--fg) 0 2px, transparent 2px 5px) 6; }
.earlier { display: block; margin: 12px auto 16px; }
.idlink { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.idlink:hover { color: var(--fg); }
.mini { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 2px 8px; font-size: 12.5px; cursor: pointer; border-radius: 2px; }
.mini:hover { border-color: var(--fg); color: var(--fg); }

.composer { flex: none; border-top: 2px solid var(--rule); margin: 0 -20px; padding: 10px 20px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); }
.crow { display: flex; gap: 10px; align-items: center; min-width: 0; margin-bottom: 8px; }
.toline { flex: 1; min-width: 0; display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
.toline::-webkit-scrollbar { display: none; }
.tochip { font-size: 13px; border: 1px solid var(--fg); padding: 1px 4px 1px 9px; display: inline-flex; gap: 4px; align-items: center; background: var(--fg); color: var(--bg); font-weight: 700; max-width: 16ch; }
.tochip span { overflow: hidden; text-overflow: ellipsis; }
.tochip button { background: none; border: 0; color: inherit; cursor: pointer; padding: 0 4px; font-weight: 400; }
.tochip.all { padding-right: 9px; letter-spacing: .06em; }
.tohint { font-size: 12px; color: var(--faint); }
.seg { display: grid; grid-template-columns: repeat(3, auto); border: 1px solid var(--fg); flex: none; }
.seg button { background: transparent; border: 0; border-left: 1px solid var(--fg); padding: 4px 10px; cursor: pointer; font-size: 13px; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); font-weight: 700; }
#msg { min-height: 64px; max-height: 40vh; font-size: 15.5px; line-height: 1.5; resize: none; display: block; }
.srow { display: flex; gap: 10px; align-items: center; margin-top: 8px; min-width: 0; }
.kindhint { font-size: 12.5px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.kbd { font-size: 12px; color: var(--faint); white-space: nowrap; }
#sendBtn { flex: none; padding: 9px 16px; letter-spacing: .06em; text-transform: uppercase; display: flex; gap: 10px; align-items: baseline; max-width: 60%; }
#sendBtn .to { font-weight: 400; text-transform: none; letter-spacing: 0; opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* ---- inbox: form carries urgency ---- */
#inbox { padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
.card { border: 1px solid var(--line); padding: 14px 16px; margin-bottom: 14px; background: var(--surface); }
.card.ask { border: 2px solid var(--fg); }
.card.request { border: 1px solid var(--fg); }
.card.note { border: 1px dashed var(--muted); }
.card.flash { box-shadow: 0 0 0 3px var(--fg); }
.card .meta { display: flex; gap: 4px 10px; align-items: baseline; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.card .meta .who2 { color: var(--fg); font-weight: 700; overflow-wrap: anywhere; }
.card .meta .id { margin-left: auto; color: var(--faint); font-size: 12px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; padding: 1px 7px; border: 1px solid var(--fg); }
.tag.ask { background: var(--fg); color: var(--bg); }
.tag.note { border-style: dashed; border-color: var(--muted); color: var(--muted); }
.card .body { white-space: pre-wrap; overflow-wrap: anywhere; margin: 10px 0; font-size: 15.5px; }
.dflt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; font-size: 13.5px; padding: 8px 10px; border-left: 3px solid var(--fg); background: var(--surface2); margin: 8px 0; overflow-wrap: anywhere; }
.dflt .k { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 11.5px; padding-top: 2px; }
.countdown { display: inline-block; font-variant-numeric: tabular-nums; font-weight: 700; margin-top: 4px; padding: 1px 0; }
.countdown.soon { background: var(--fg); color: var(--bg); padding: 1px 8px; }
.ctx { font-size: 13.5px; color: var(--muted); border-left: 1px solid var(--line); padding: 2px 0 2px 10px; margin: 6px 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.opts { display: grid; gap: 6px; margin: 10px 0 4px; }
.opts .hint { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.opt { display: grid; grid-template-columns: 3.2ch minmax(0, 1fr); gap: 2px 8px; text-align: left; background: transparent; border: 1px solid var(--line); padding: 8px 10px; cursor: pointer; border-radius: 2px; min-width: 0; }
.opt:hover { border-color: var(--fg); }
.opt[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 3px 0 0 var(--fg); background: var(--surface2); }
.opt .mk { font-weight: 700; white-space: nowrap; }
.opt .ol { font-weight: 700; overflow-wrap: anywhere; }
.opt .badge { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; border: 1px solid currentColor; padding: 0 5px; margin-left: 8px; font-weight: 400; color: var(--muted); white-space: nowrap; }
.opt .badge.rec { color: var(--fg); }
.opt .od { grid-column: 2; font-size: 13.5px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.opt.closed { cursor: default; }
.disc { margin: 10px 0 0; border-top: 1px solid var(--line); }
.disc .d { padding: 6px 0 0; font-size: 14px; }
.disc .d .who2 { font-weight: 700; } .disc .d .when { color: var(--faint); font-size: 12px; margin-left: 6px; }
.disc .d.op { padding-left: 10px; border-left: 2px solid var(--fg); }
.disc .d .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.reply { margin-top: 10px; display: grid; gap: 8px; }
.reply .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.reply .row .spacer { flex: 1; }
details.closed { margin-top: 18px; }
details.closed summary { cursor: pointer; color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.card.done { opacity: .6; border: 1px solid var(--line); }
.res { font-size: 13.5px; overflow-wrap: anywhere; }
.sent .ans { border-top: 1px solid var(--line); padding: 8px 0 2px; }
.sent .ans .who2 { font-weight: 700; } .sent .ans .when { color: var(--faint); font-size: 12px; margin-left: 8px; }
.sent .ans .txt { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; font-size: 14.5px; }
.sent .ansact { margin-top: 4px; }
.sent .mine { margin: 6px 0 0 14px; padding-left: 10px; border-left: 2px solid var(--fg); font-size: 14px; }
.sent .mine .who2 { font-weight: 700; }
.sent .mine .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.sent .waiting { color: var(--faint); font-size: 13px; padding: 6px 0; }
.sent-h { margin-top: 30px; }
.res b { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; }

/* ---- login / toast ---- */
#login { max-width: 420px; margin: 18vh auto; padding: 0 var(--gutter); }
#login .wordmark { font-size: 34px; }
#login p { color: var(--muted); }
#login .row { display: flex; gap: 8px; margin-top: 10px; }
/* ---- handoff reader ---- */
#reader { position: fixed; inset: 0; z-index: 25; background: color-mix(in srgb, var(--bg) 70%, transparent); display: flex; justify-content: center; align-items: flex-start; padding: 5vh 16px; overflow-y: auto; overscroll-behavior: contain; }
#reader .sheet { background: var(--surface); border: 2px solid var(--fg); max-width: 760px; width: 100%; min-width: 0; padding: 0 22px 24px; box-shadow: var(--shadow); }
#reader .top { position: sticky; top: -5vh; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; border-bottom: 1px solid var(--rule); padding: 16px 0 8px; margin-bottom: 6px; background: var(--surface); }
#reader .top h2 { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; margin: 0; }
#reader .top .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
#reader .note h4 { font-size: 14px; letter-spacing: .1em; text-transform: uppercase; margin: 18px 0 6px; }
#reader .note p, #reader .note li { line-height: 1.55; overflow-wrap: anywhere; }
#reader .note ul { padding-left: 20px; margin: 4px 0; }
#reader .note blockquote { margin: 6px 0; padding: 4px 12px; border-left: 3px solid var(--fg); background: var(--surface2); overflow-wrap: anywhere; }
#reader .note em { color: var(--muted); }
#reader .bottom { margin-top: 18px; display: flex; justify-content: flex-end; gap: 8px; }
/* files: rendered markdown, text, images */
.files { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.file { display: inline-flex; gap: 6px; align-items: baseline; font-size: 13px; border: 1px solid var(--fg); padding: 2px 9px; background: var(--surface); cursor: pointer; max-width: 100%; color: var(--fg); }
.file .fn { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.file .fs { color: var(--muted); font-size: 12px; white-space: nowrap; }
.file:hover { background: var(--surface2); }
.file.gone { border-style: dashed; color: var(--faint); cursor: default; text-decoration: line-through; }
.ev .files { margin: 4px 0 0; } .ev .file { font-size: 12px; padding: 0 7px; }
#reader .note.md { line-height: 1.6; overflow-wrap: anywhere; }
#reader .note.md h1, #reader .note.md h2, #reader .note.md h3 { font-size: 16px; letter-spacing: .06em; margin: 20px 0 6px; }
#reader .note.md h1 { font-size: 19px; } #reader .note.md h4 { font-size: 14px; letter-spacing: .1em; text-transform: uppercase; }
#reader .note.md code { background: var(--surface2); padding: 0 4px; font-size: .92em; }
#reader .note.md pre { background: var(--surface2); padding: 10px 12px; overflow-x: auto; border-left: 3px solid var(--line); }
#reader .note.md pre code { background: none; padding: 0; }
#reader .note.md table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 13.5px; margin: 10px 0; }
#reader .note.md th, #reader .note.md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
#reader .note.md th { background: var(--surface2); }
#reader .note.md img { max-width: 100%; }
#reader .note.md hr { border: 0; border-top: 1px solid var(--rule); margin: 18px 0; }
#reader .note.plain { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
#reader .note img.whole { max-width: 100%; display: block; margin: 10px auto; }
#toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 16px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 32px); z-index: 30; }
#toast.show { opacity: 1; }

/* ---- telemetry ---- */
:root { --s1: #e3e6ea; --s2: #c3c8cf; --s3: #8f97a1; --s4: #4f5761; --s5: #0b0c0e; --grid: #e6e8eb; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --s1: #1b1f25; --s2: #353b44; --s3: #6b737e; --s4: #aab2bc; --s5: #f2f3f5; --grid: #1f2329; } }
:root[data-theme="dark"] { --s1: #1b1f25; --s2: #353b44; --s3: #6b737e; --s4: #aab2bc; --s5: #f2f3f5; --grid: #1f2329; }
#telem { min-height: 0; overflow-y: auto; padding: 22px max(var(--gutter), env(safe-area-inset-right, 0px)) 72px max(var(--gutter), env(safe-area-inset-left, 0px)); }
#telem > * { max-width: 1680px; margin-left: auto; margin-right: auto; }
.tfilters { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.tfilters .seg { grid-template-columns: repeat(4, 64px); }
.tfilters .seg button { padding: 6px 4px; }
.tfilters .upd { font-size: 12.5px; color: var(--muted); }
#telemBody.loading { opacity: .55; transition: opacity .2s; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 22px; }
.tile { border: 1px solid var(--line); padding: 12px 14px; }
.tile .tl { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.tile .tv { font-size: 30px; font-weight: 700; line-height: 1.15; margin-top: 4px; }
.tile .ts2 { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.tgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; }
.tcard { border: 1px solid var(--rule); padding: 14px 16px; min-width: 0; }
.tcard.wide { grid-column: 1 / -1; }
.tcard h3 { font-family: var(--f-display); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; margin: 0; }
.tcard .sub { font-size: 12.5px; color: var(--muted); margin: 2px 0 10px; }
.tcard svg { display: block; width: 100%; overflow: visible; }
.tcard svg text { fill: var(--muted); font-family: var(--f-body); font-size: 11px; }
.tcard svg .gl { stroke: var(--grid); stroke-width: 1; }
.tcard svg .ax { stroke: var(--line); stroke-width: 1; }
.tcard svg .bar { fill: var(--fg); }
.tcard svg .hit { fill: transparent; cursor: crosshair; }
.tcard svg .hit:hover + .bar, .tcard svg .bar.hot { opacity: .7; }
.tcard svg .ln { fill: none; stroke: var(--fg); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.tcard svg .ar { fill: var(--fg); opacity: .1; }
.tcard svg .xh { stroke: var(--muted); stroke-width: 1; }
.tcard svg .dot { fill: var(--fg); stroke: var(--surface); stroke-width: 2; }
.sm { display: grid; grid-template-columns: minmax(120px, 220px) minmax(0, 1fr) 90px 110px; gap: 4px 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.sm.head { color: var(--muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-top: 0; }
.sm .h { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.sm .h small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.sm .num { text-align: right; font-variant-numeric: tabular-nums; }
.sm .rc { display: inline-block; margin-top: 3px; font-weight: 400; font-size: 12px; color: var(--muted); text-decoration: none; border: 1px solid var(--line); padding: 0 6px; white-space: nowrap; }
.sm .rc:hover { color: var(--fg); border-color: var(--fg); }
.mx { border-collapse: separate; border-spacing: 2px; font-size: 12.5px; }
.mx th { font-weight: 400; color: var(--muted); padding: 2px 6px; text-align: left; white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
.mx thead th { writing-mode: vertical-rl; transform: rotate(180deg); text-align: left; height: 120px; vertical-align: bottom; }
.mx td { width: 34px; min-width: 34px; height: 26px; text-align: center; font-variant-numeric: tabular-nums; cursor: default; }
.mx td.c0 { background: transparent; color: var(--faint); }
.mx td.c1 { background: var(--s1); color: var(--fg); } .mx td.c2 { background: var(--s2); color: var(--fg); }
.mx td.c3 { background: var(--s3); color: var(--fg); } .mx td.c4 { background: var(--s4); color: var(--bg); } .mx td.c5 { background: var(--s5); color: var(--bg); }
.mx td:hover { outline: 1px solid var(--fg); }
.mxwrap { overflow-x: auto; }
.ramp { display: flex; gap: 2px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 8px; }
.ramp span.sw { width: 18px; height: 10px; display: inline-block; }
table.tt { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.tt th, table.tt td { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: right; }
table.tt th:first-child, table.tt td:first-child { text-align: left; }
table.tt th { color: var(--muted); font-weight: 400; }
details.tv { margin-top: 10px; } details.tv summary { cursor: pointer; font-size: 12.5px; color: var(--muted); padding: 6px 0; }
details.tv .scroll { max-height: 280px; overflow: auto; margin-top: 6px; }
#tip { position: fixed; z-index: 30; pointer-events: none; background: var(--surface); border: 1px solid var(--fg); padding: 6px 9px; font-size: 12.5px; box-shadow: var(--shadow); max-width: 280px; display: none; }
#tip .v { font-weight: 700; font-size: 14px; } #tip .l { color: var(--muted); }
#tip .row { display: flex; gap: 8px; justify-content: space-between; }
@media (max-width: 1000px) { .tgrid { grid-template-columns: minmax(0, 1fr); } .sm { grid-template-columns: minmax(0, 1fr) 80px 90px; } .sm .spark { grid-column: 1 / -1; grid-row: 2; } }

@media (max-width: 1180px) {
  main { grid-template-columns: 200px minmax(0, 1.15fr) minmax(0, 1fr); }
  .pane { padding-left: 14px; padding-right: 14px; }
  .composer { margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
  .kbd { display: none; }
}
/* phones, and any screen too short for three columns (a phone held sideways): one pane at a time */
@media (max-width: 860px), (max-height: 520px) and (max-width: 1100px) {
  nav.tabs { display: flex; }
  main { display: block; position: relative; }
  .pane { display: none; position: absolute; inset: 0; border-left: 0 !important; padding: 14px max(var(--gutter), env(safe-area-inset-right, 0px)) 32px max(var(--gutter), env(safe-area-inset-left, 0px)); }
  .pane.active { display: block; }
  #feed.active, #roster.active { display: flex; }
  #feed:not(.active), #roster:not(.active) { display: none; }
  #feed { padding-bottom: 0; }
  .composer { margin: 0 calc(-1 * max(var(--gutter), env(safe-area-inset-left, 0px))); padding-left: var(--gutter); padding-right: var(--gutter); }
  header.top { padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-bottom: 8px; gap: 12px; }
  header.top .wide { display: none; }
  .wordmark { font-size: 19px; }
  #writeBtn { display: flex; justify-content: space-between; }
  .who { padding: 10px 6px; }
  .who .act { padding: 3px 8px; }
  .mini, .seg button, .btn { min-height: 40px; }
  .tochip { min-height: 30px; }
  #sendBtn { min-height: 44px; }
  .sec-h .tools { gap: 10px; }
  .kindhint { display: none; }
  .crow { flex-wrap: wrap; }
  .crow .lbl { display: none; }
  .toline { flex-basis: 100%; order: 2; }
  .seg#kindSeg { order: 1; width: 100%; grid-template-columns: repeat(3, 1fr); }
  #sendBtn { max-width: none; flex: 1; justify-content: space-between; }
  nav.tabs button { white-space: nowrap; letter-spacing: .04em; font-size: 12.5px; }
  header.top { gap: 8px; padding-right: 8px; }
  header.top .eyebrow { gap: 2px; }
  header.top .btn.ghost { padding: 4px 6px; min-height: 36px; letter-spacing: 0; }
}
/* a phone held sideways: the composer folds to one band (kinds + chips, then text beside send) */
@media (max-height: 520px) and (max-width: 1100px) {
  header.top { padding-top: 4px; padding-bottom: 4px; }
  nav.tabs button { min-height: 36px; padding: 6px 4px; }
  #feed .sec-h { display: none; }
  .composer { padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: end; }
  .composer .crow { grid-column: 1 / -1; flex-wrap: nowrap; margin: 0; }
  .composer .toline { order: 0; flex-basis: auto; }
  .seg#kindSeg { order: 1; width: auto; grid-template-columns: repeat(3, auto); }
  .seg#kindSeg button { min-height: 32px; padding: 2px 10px; }
  .composer #msg { min-height: 40px; max-height: 30vh; }
  .composer .srow { margin: 0; }
  #sendBtn { min-height: 40px; flex: none; }
  #sendBtn .to { display: none; }
}

<link rel="stylesheet" href="/brand.css">
<script src="/telemetry.js" defer></script>

<body>
<div id="login" hidden>
  <h1 class="wordmark">orchestra</h1>
  <p>Paste your operator token. It's kept as a cookie on this device.</p>
  <form onsubmit="login(event)">
    <input id="tok" type="password" autocomplete="current-password" placeholder="token" required>
    <div class="row"><button class="btn primary" type="submit">Sign in</button></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <h1 class="wordmark">orchestra</h1>
    <div class="eyebrow"><span class="dot" id="live" title="live stream"></span><span id="meta"></span></div>
    <span class="spacer"></span>
    <div class="eyebrow">
      <button class="btn ghost wide" id="viewBtn" onclick="toggleView()">telemetry</button>
      <button class="btn ghost" id="pushBtn" onclick="enablePush()">enable push</button>
      <button class="btn ghost" onclick="cycleTheme()" title="theme: system → flip → system">theme</button>
    </div>
  </header>
  <nav class="tabs">
    <button data-tab="inbox" class="active">Inbox <span id="tabInbox"></span></button>
    <button data-tab="feed">Bus</button>
    <button data-tab="roster">Sessions <span id="tabTo"></span></button>
    <button data-tab="telem">Stats</button>
  </nav>
  <main>
    <aside id="roster" class="pane">
      <div class="sec-h"><h2>Sessions</h2><span class="n" id="liveCount"></span></div>
      <div class="list">
        <button class="who all" data-to="@all" aria-pressed="true"><span class="g">✱</span><span class="nm">everyone</span><span></span></button>
        <div id="sessions"></div>
      </div>
      <div class="rfoot">
        <button class="btn primary" id="writeBtn" onclick="focusCompose()"><span>write</span><span id="writeTo"></span></button>
        <div class="two">
          <button class="btn" id="haltBtn" onclick="haltSel()">⏸ halt all</button>
          <button class="btn" id="resumeBtn" onclick="resumeSel()">▶ resume all</button>
        </div>
        <div class="meta">
          <button class="btn ghost" onclick="testPush()">test push</button>
          <button class="btn ghost" onclick="logout()">sign out</button>
        </div>
      </div>
    </aside>

    <section id="feed" class="pane">
      <div class="sec-h"><h2>Bus</h2>
        <div class="tools">
          <label><input type="checkbox" id="hideStatus"> hide status</label>
          <label><input type="checkbox" id="onlyMine"> mine</label>
          <button class="mini" id="feedOrder" title="sort the bus">newest first</button>
        </div>
      </div>
      <div class="search"><input id="q" type="search" placeholder="search: text, @handle, or an id" autocomplete="off" spellcheck="false"></div>
      <div class="searchnote" id="searchNote" hidden></div>
      <div class="scroll" id="feedScroll"><div id="events"></div></div>
      <div class="composer">
        <div class="crow"><span class="lbl">to</span><div class="toline" id="toLine"></div>
          <div class="seg" id="kindSeg">
            <button data-kind="notice" aria-pressed="true">notice</button>
            <button data-kind="request" aria-pressed="false">request</button>
            <button data-kind="info" aria-pressed="false">info</button>
          </div>
        </div>
        <textarea id="msg" rows="2" placeholder="write to the sessions…"></textarea>
        <div class="srow"><span class="kindhint" id="kindHint"></span><span class="kbd">ctrl/⌘ + enter</span>
          <button class="btn primary" id="sendBtn" onclick="send()"><span>Send</span><span class="to" id="sendTo">notice → everyone</span></button></div>
      </div>
    </section>

    <section id="inbox" class="pane active">
      <div class="sec-h"><h2>Inbox</h2><span class="n" id="openCount"></span>
        <div class="tools"><select class="mini" id="inboxSort" title="sort the inbox">
          <option value="urgent">urgent first</option><option value="new">newest</option><option value="old">oldest</option><option value="who">by session</option>
        </select></div></div>
      <div id="open"></div>
      <details class="closed"><summary>recently closed</summary><div id="closed" style="margin-top:12px"></div></details>
      <div class="sec-h sent-h"><h2>Your requests</h2><span class="n" id="sentCount"></span></div>
      <div id="sent"></div>
    </section>
  </main>
  <div id="telem" hidden>
    <div class="tfilters">
      <div class="seg" id="tRange">
        <button data-h="1" aria-pressed="false">1h</button><button data-h="6" aria-pressed="false">6h</button>
        <button data-h="24" aria-pressed="true">24h</button><button data-h="168" aria-pressed="false">7d</button>
      </div>
      <span class="upd" id="tUpd"></span>
    </div>
    <div id="telemBody"><div class="empty">loading telemetry…</div></div>
  </div>
</div>
<div id="tip"></div>
<div id="reader" hidden onclick="if (event.target === this) closeReader()"><div class="sheet">
  <div class="top"><h2 id="rdTitle">Handoff</h2><span class="meta" id="rdMeta"></span><span class="spacer"></span>
    <button class="btn ghost" id="rdOlder" onclick="stepReader(1)">older</button><button class="btn ghost" id="rdNewer" onclick="stepReader(-1)">newer</button>
    <button class="btn" onclick="closeReader()">close</button></div>
  <div class="note" id="rdNote"></div>
  <div class="bottom"><a class="btn ghost" id="rdDl" hidden download>download</a><button class="btn" onclick="closeReader()">close</button></div></div></div>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let state = null, events = [], es = null, pubKey = null;
const OP = () => (state && state.operator) || "operator";
window.orcState = () => state;  // telemetry.js reads presence from here
const drafts = {};
const compose = { to: "@all", kind: "notice" };
const KIND_HINT = {
  notice: "pushed into the session as a turn; carries your authority",
  request: "pushed; asks for a reply; answers collect under Your requests",
  info: "pushed; context for the sessions, no reply expected",
};
const narrow = () => matchMedia("(max-width: 860px), (max-height: 520px) and (max-width: 1100px)").matches;

function store(k, v) { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
function recall(k) { try { return localStorage.getItem(k); } catch { return null; } }
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2600); }

async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: "same-origin", headers: { "content-type": "application/json" }, ...opts });
  if (r.status === 401) { showLogin(); throw new Error("signed out"); }
  if (!r.ok) { let d = r.statusText; try { d = (await r.json()).detail || d; } catch {} throw new Error(d); }
  return r.json();
}
const post = (body) => api("/api/events", { method: "POST", body: JSON.stringify({ from: "operator", ...body }) });

function showLogin() { $("#app").hidden = true; $("#login").hidden = false; if (es) es.close(); }
async function login(e) {
  e.preventDefault();
  try { await api("/api/login", { method: "POST", body: JSON.stringify({ token: $("#tok").value.trim() }) }); $("#tok").value = ""; boot(); }
  catch (err) { toast("sign-in failed: " + err.message); }
}
async function logout() { await api("/api/logout", { method: "POST" }); showLogin(); }

// ---- theme: follow the system, or pin one; stored per device ----
function applyTheme() { const t = recall("orc-theme"); if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
function cycleTheme() {
  const cur = recall("orc-theme");
  const next = cur === null ? (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark") : null;
  store("orc-theme", next ?? undefined); applyTheme(); toast(next ? `${next} theme` : "following system theme");
}

// ---- names: each session shows its shortest unique leading words ----
// The server takes any unique prefix as an address (@steer reaches steering-and-serving-…), so the
// short name shown is also one you could type. The full handle is always in the title.
let nicks = {};
function computeNicks() {
  const hs = new Set((state ? state.presence : []).map((p) => p.handle));
  for (const e of events) { if (e.from && e.from !== OP() && e.from !== "orchestra") hs.add(e.from); }
  const all = [...hs], out = {};
  for (const h of all) {
    const parts = h.split("-");
    out[h] = h;
    for (let k = 1; k <= parts.length; k++) {
      const cand = parts.slice(0, k).join("-");
      if (!all.some((o) => o !== h && o.startsWith(cand))) { out[h] = cand; break; }
    }
  }
  nicks = out;
}
const nick = (h) => (h === OP() ? "you" : nicks[h] || h);
const nickTo = (to) => (to === "@all" ? "everyone" : String(to).split(",").map((r) => nick(r.replace(/^@/, ""))).join(", "));

// ---- time ----
const hhmm = (iso) => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago"; return Math.floor(s / 86400) + "d ago";
}
function left(iso) {
  const s = Math.round((new Date(iso) - Date.now()) / 1000);
  if (s <= 0) return "defaulting…";
  const m = Math.floor(s / 60), h = Math.floor(m / 60);
  return (h ? `${h}h ${m % 60}m` : m ? `${m}m ${String(s % 60).padStart(2, "0")}s` : `${s}s`) + " to default";
}
function tickCountdowns() {
  document.querySelectorAll(".countdown").forEach((el) => {
    el.textContent = left(el.dataset.deadline);
    el.classList.toggle("soon", new Date(el.dataset.deadline) - Date.now() < 10 * 60 * 1000);
  });
}

// ---- inbox ----
// Picks on option cards survive re-renders (they live here, not in the DOM).
const picks = {};
function optionsBlock(t, closed) {
  if (!t.options || !t.options.length) return "";
  const sel = closed ? new Set(t.choice || []) : (picks[t.id] || new Set());
  const rows = t.options.map((o) => {
    const on = sel.has(o.label);
    const mk = t.multi ? (on ? "[x]" : "[ ]") : (on ? "(•)" : "( )");
    const badges = (o.recommended ? `<span class="badge rec">recommended</span>` : "")
      + (t.kind === "ask" && t.default === o.label ? `<span class="badge">default</span>` : "");
    return `<button class="opt${closed ? " closed" : ""}" data-t="${esc(t.id)}" data-label="${esc(o.label)}" aria-pressed="${on}"${closed ? " disabled" : ""}>
      <span class="mk">${mk}</span><span><span class="ol">${esc(o.label)}</span>${badges}</span>${o.description ? `<span class="od">${esc(o.description)}</span>` : ""}</button>`;
  }).join("");
  const hint = closed ? "" : `<span class="hint">${t.multi ? "pick any" : "pick one"}, or answer in your own words</span>`;
  return `<div class="opts">${hint}${rows}</div>`;
}
function discussion(t) {
  // the back-and-forth on a thread: replies both ways, and other sessions' answers to a group request
  const items = (t.answers || []);
  if (!items.length) return "";
  return `<div class="disc">${items.map((a) => `<div class="d${a.from === OP() ? " op" : ""}"><span class="who2" title="${esc(a.from)}">${esc(nick(a.from))}</span><span class="when">${a.kind === "answer" ? "answered · " : ""}${a.ts ? ago(a.ts) : ""}</span><div class="txt">${esc(a.body)}</div></div>`).join("")}</div>`;
}
const fmtSize = (n) => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : n >= 1024 ? Math.round(n / 1024) + " KB" : n + " B";
function filesBlock(atts) {
  if (!atts || !atts.length) return "";
  return `<div class="files">${atts.map((a) => {
    const gone = a.available === false;
    const when = a.expires_at ? (gone ? `deleted ${ago(a.expires_at)}` : `kept until ${new Date(a.expires_at).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })}`) : "";
    return `<button class="file${gone ? " gone" : ""}" ${gone ? "disabled" : `data-file="${esc(a.sha256)}" data-name="${esc(a.name)}" data-mime="${esc(a.mime)}" data-size="${a.size}"`} title="${esc(a.name)} · ${fmtSize(a.size)} · sha256 ${esc(a.sha256.slice(0, 12))}… · ${esc(when)}">📎 <span class="fn">${esc(a.name)}</span><span class="fs">${fmtSize(a.size)}</span></button>`;
  }).join("")}</div>`;
}
function threadCard(t, closed) {
  const k = t.kind;
  const topic = t.topic ? `<span>#${esc(t.topic)}</span>` : "";
  let extra = t.context ? `<div class="ctx">${esc(t.context)}</div>` : "";
  extra += optionsBlock(t, closed);
  if (k === "ask") {
    extra += `<div class="dflt"><span class="k">default</span><span><b>${esc(t.default)}</b></span>${t.revert_cost ? `<span class="k">revert</span><span>${esc(t.revert_cost)}</span>` : ""}</div>`;
    if (!closed) extra += `<span class="countdown" data-deadline="${esc(t.deadline)}">${left(t.deadline)}</span>`;
  }
  let foot;
  if (!closed) {

  try { await post({ to: compose.to, kind: compose.kind, body }); $("#msg").value = ""; growMsg(); store("orc-draft"); const away = state.presence.filter((p) => toList().includes("@" + p.handle) && !p.live).map((p) => nick(p.handle));
    toast(away.length ? `${compose.kind} sent → ${toLabel()} · held for ${away.join(", ")} until back` : `${compose.kind} sent → ${toLabel()}`); }

async function haltSel() {

  try { await post({ to: compose.to, kind: "halt", body: why }); toast(`halt → ${toLabel()}`); } catch (e) { toast(e.message); }

// ---- handoff reader: continuity's notes, rendered from escaped markdown ----
let reader = { handle: null, notes: [], i: 0 };
function mdLite(src) {
  const inline = (t) => esc(t).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const out = []; let list = false;
  for (const raw of src.split("\n")) {
    const line = raw.trimEnd();
    const li = /^\s*[-*] (.*)$/.exec(line);
    if (!li && list) { out.push("</ul>"); list = false; }
    if (/^#{1,3} /.test(line)) out.push(`<h4>${inline(line.replace(/^#+ /, ""))}</h4>`);
    else if (li) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inline(li[1])}</li>`); }
    else if (/^> ?/.test(line)) out.push(`<blockquote>${inline(line.replace(/^> ?/, ""))}</blockquote>`);
    else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push("</ul>");
  return out.join("");
}
async function openReader(handle) {
  try {
    const d = await api(`/api/handoffs/${encodeURIComponent(handle)}`);
    if (!d.notes.length) return toast("no handoff notes yet");
    reader = { handle, notes: d.notes, i: 0 }; $("#rdTitle").textContent = "Handoff"; $("#rdOlder").hidden = $("#rdNewer").hidden = false; $("#rdDl").hidden = true;
    $("#rdNote").className = "note"; paintReader(); $("#reader").hidden = false; $("#reader").scrollTop = 0;
    history.pushState({ reader: 1 }, "");  // the phone's back button closes it
  } catch (e) { toast("couldn't load: " + e.message); }
}
function paintReader() {
  const n = reader.notes[reader.i];
  $("#rdMeta").textContent = `${nick(reader.handle)} · ${n.why || "note"} · ${ago(n.written_at)} · ${reader.i + 1}/${reader.notes.length}`;
  $("#rdNote").innerHTML = mdLite(n.text);
  $("#rdOlder").disabled = reader.i >= reader.notes.length - 1; $("#rdNewer").disabled = reader.i === 0;
}
function stepReader(d) { reader.i = Math.max(0, Math.min(reader.notes.length - 1, reader.i + d)); paintReader(); $("#reader").scrollTop = 0; }
// ---- files: markdown rendered (and sanitized), text as text, images inline, PDFs in a tab ----
const isMd = (name, mime) => /\.(md|markdown)$/i.test(name) || mime === "text/markdown";
const isText = (mime) => /^text\//.test(mime) || /json|yaml|toml|xml|x-sh/.test(mime);
async function openFile(sha, name, mime, size) {
  const url = `/api/files/${sha}`;
  if (mime === "application/pdf") return window.open(url, "_blank", "noopener");
  $("#rdTitle").textContent = "File";
  $("#rdMeta").textContent = `${name} · ${fmtSize(+size)}`;
  $("#rdOlder").hidden = $("#rdNewer").hidden = true;
  const dl = $("#rdDl"); dl.hidden = false; dl.href = url; dl.setAttribute("download", name);
  const box = $("#rdNote"); box.className = "note"; box.textContent = "loading…";
  $("#reader").hidden = false; $("#reader").scrollTop = 0; history.pushState({ reader: 1 }, "");
  try {
    if (/^image\/(png|jpeg|gif|webp)$/.test(mime)) { box.innerHTML = `<img class="whole" alt="${esc(name)}" src="${url}">`; return; }
    if (!isMd(name, mime) && !isText(mime)) { box.textContent = "This kind of file isn't shown here; download it."; return; }
    const r = await fetch(url, { credentials: "same-origin" });
    if (!r.ok) { box.textContent = r.status === 410 ? "This file has been deleted (it's kept for a day after you close its message)." : `couldn't load it (${r.status})`; return; }
    const text = await r.text();
    if (isMd(name, mime) && window.marked && window.DOMPurify) {
      box.className = "note md";
      box.innerHTML = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: false }), { FORBID_TAGS: ["style", "form", "input"], FORBID_ATTR: ["style"] });
      box.querySelectorAll("a[href]").forEach((a) => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
    } else { box.className = "note plain"; box.textContent = text; }
  } catch (e) { box.textContent = "couldn't load it: " + e.message; }
}
document.addEventListener("click", (e) => {
  const f = e.target.closest(".file[data-file]"); if (!f) return;
  e.stopPropagation(); e.preventDefault();
  openFile(f.dataset.file, f.dataset.name, f.dataset.mime, f.dataset.size);
}, true);
function closeReader() { if ($("#reader").hidden) return; $("#reader").hidden = true; if (history.state && history.state.reader) history.back(); }
window.addEventListener("popstate", () => { if (!$("#reader").hidden) $("#reader").hidden = true; });

// ---- push ----
function b64ToBytes(b64) { const p = "=".repeat((4 - (b64.length % 4)) % 4); const raw = atob((b64 + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(raw, (c) => c.charCodeAt(0)); }
const swReg = () => navigator.serviceWorker.register("/sw.js", { scope: "/" });
async function enablePush() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return toast("this browser can't do web push");
  if (!pubKey) return toast("server has no push key");
  try {
    if ((await Notification.requestPermission()) !== "granted") return toast("notifications not allowed");
    const reg = await swReg();
    const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(pubKey) }));
    await api("/api/push/subscribe", { method: "POST", body: JSON.stringify(sub.toJSON()) });
    toast("push on for this device"); updatePushBtn(); refresh();
  } catch (e) { toast("push failed: " + e.message); }
}
async function updatePushBtn() {
  const btn = $("#pushBtn");
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) { btn.hidden = true; return; }
  const reg = await navigator.serviceWorker.getRegistration("/");
  const sub = reg && (await reg.pushManager.getSubscription());
  btn.textContent = sub && Notification.permission === "granted" ? "push on" : "enable push";
}
async function testPush() { try { const r = await api("/api/push/test", { method: "POST" }); toast(`test push → ${r.delivered} device(s)`); } catch (e) { toast(e.message); } }

// ---- live ----
async function refresh() { state = await api("/api/state"); pubKey = state.push && state.push.public_key; renderInbox(); keepFocus(renderSessions); }
// A burst of events asks for one state fetch, not one each.
let refreshTimer = null, refreshing = false;
function refreshSoon() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async () => {
    if (refreshing) return refreshSoon();
    refreshing = true; try { await refresh(); } catch {} finally { refreshing = false; }
  }, 300);
}
function connect() {
  if (es) es.close();
  const after = events.length ? events[events.length - 1].seq : state.head;
  es = new EventSource(`/api/stream?after=${after}`);
  es.addEventListener("bus", (m) => {
    const e = JSON.parse(m.data);
    if (events.length && e.seq <= events[events.length - 1].seq) return;
    events.push(e); if (events.length > 5000) events.splice(0, events.length - 5000);
    if (e.from && !(e.from in nicks) && e.from !== OP()) computeNicks();
    prependEvent(e);
    if (["ask", "request", "note", "answer", "ack", "defaulted", "withdraw", "reply"].includes(e.kind)) refreshSoon();
    else state.head = e.seq;
  });
  es.onopen = () => $("#live").classList.add("on");
  // reconnect from the newest event we hold (the browser's own retry would replay from page load)
  es.onerror = () => { $("#live").classList.remove("on"); es.close(); clearTimeout(connect.t); connect.t = setTimeout(connect, 3000); };
}
function flashHash() {
  const q = location.hash.match(/q=([\w-]+)/);  // permalinks: /m/<id> redirects to /#q=<id>
  if (q) { history.replaceState(null, "", location.pathname); setSearch(q[1]); return; }
  const m = location.hash.match(/t=([\w-]+)/); if (!m) return;
  const el = document.getElementById("t-" + m[1]); if (!el) return;
  showTab("inbox"); el.classList.add("flash"); el.scrollIntoView({ block: "center" }); setTimeout(() => el.classList.remove("flash"), 2500);
  history.replaceState(null, "", location.pathname);
}
function showTab(id) {
  document.querySelectorAll("nav.tabs button").forEach((x) => x.classList.toggle("active", x.dataset.tab === id));
  if (id === "telem") return setView("telem");

  document.querySelectorAll("main > .pane").forEach((s) => {

    if (s.classList.contains("active")) s.dataset.y = sc.scrollTop;
    s.classList.toggle("active", s.id === id);
  });

  if (p.dataset.y) sc.scrollTop = +p.dataset.y;

}

}

document.querySelectorAll("nav.tabs button").forEach((b) => (b.onclick = () => showTab(b.dataset.tab)));
$("#hideStatus").onchange = renderFeed; $("#onlyMine").onchange = renderFeed;

let lastNarrow = null;
