<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>orchestra</title>
<meta name="theme-color" content="#14121a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #14121a; --panel: #1c1924; --panel2: #24202e; --line: #322c3f;
  --text: #e9e4f2; --dim: #9a91ab; --faint: #6c6480;
  --ask: #ff6b7d; --req: #ffb454; --note: #7cc4ff; --ok: #7be0a6; --accent: #c39bff;
  --radius: 12px;
  font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; }
button, textarea, select, input { font: inherit; color: inherit; }
button {
  background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 12px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #1a1222; border-color: var(--accent); font-weight: 600; }
button.danger { border-color: var(--ask); color: var(--ask); }
button:disabled { opacity: .5; cursor: default; }
textarea, select, input {
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%;
}
textarea { resize: vertical; min-height: 2.6em; }

header {
  position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(6px); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px; padding: 10px 16px; flex-wrap: wrap;
}
header h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
header h1 span { color: var(--accent); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); display: inline-block; }
.dot.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
header .spacer { flex: 1; }
header .meta { color: var(--dim); font-size: 13px; }

nav.tabs { display: none; gap: 6px; padding: 8px 16px 0; }
nav.tabs button { flex: 1; }
nav.tabs button.active { border-color: var(--accent); color: var(--accent); }

main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) 300px; gap: 16px; padding: 16px; }
section { min-width: 0; }
section > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 4px 0 10px; display: flex; gap: 8px; align-items: center; }
section > h2 .count { background: var(--panel2); border-radius: 99px; padding: 0 8px; color: var(--text); }

.card {
  background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--faint);
  border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px;
}
.card.ask { border-left-color: var(--ask); }
.card.request { border-left-color: var(--req); }
.card.note { border-left-color: var(--note); }
.card.flash { outline: 2px solid var(--accent); }
.card .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; color: var(--dim); }
.badge { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 7px; border-radius: 99px; }
.badge.ask { background: color-mix(in srgb, var(--ask) 22%, transparent); color: var(--ask); }
.badge.request { background: color-mix(in srgb, var(--req) 22%, transparent); color: var(--req); }
.badge.note { background: color-mix(in srgb, var(--note) 22%, transparent); color: var(--note); }
.from { color: var(--text); font-weight: 600; }
.body { white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; }
.dflt { font-size: 13px; color: var(--dim); background: var(--panel2); border-radius: 8px; padding: 6px 10px; margin: 6px 0; }
.dflt b { color: var(--text); font-weight: 600; }
.countdown { font-variant-numeric: tabular-nums; color: var(--ask); font-weight: 600; }
.actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.actions textarea { flex: 1 1 100%; }
.empty { color: var(--faint); padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: var(--radius); }
details.closed summary { cursor: pointer; color: var(--dim); font-size: 13px; margin: 10px 0; }
.card.done { opacity: .65; }
.res { font-size: 13px; color: var(--ok); }

.feed { font-size: 13.5px; }
.ev { padding: 7px 10px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 48px 1fr; gap: 8px; }
.ev .ts { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 1px; }
.ev .who { color: var(--dim); }
.ev .who b { color: var(--text); font-weight: 600; }
.ev .k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
.ev.op .who b { color: var(--accent); }
.ev.halt, .ev.ask { background: color-mix(in srgb, var(--ask) 8%, transparent); }
.ev .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.feed-tools { display: flex; gap: 12px; align-items: center; font-size: 13px; color: var(--dim); margin-bottom: 8px; }
.feed-tools label { display: flex; gap: 6px; align-items: center; }
.feed-tools input { width: auto; }

.sess { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.sess .h { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess .st { color: var(--dim); font-size: 12px; }
.sess .np { color: var(--req); font-size: 11px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 14px; }
.panel .row { display: flex; gap: 8px; margin-top: 8px; }
.hint { color: var(--faint); font-size: 12px; margin-top: 6px; }

#login { max-width: 360px; margin: 18vh auto; padding: 0 16px; }
#login h1 { font-size: 22px; } #login h1 span { color: var(--accent); }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 32px); }
#toast.show { opacity: 1; }

@media (max-width: 980px) {
  main { grid-template-columns: 1fr; padding: 12px 16px; }
  nav.tabs { display: flex; }
  main > section { display: none; }
  main > section.active { display: block; }
}
</style>
</head>
<body>
<div id="login" hidden>
  <h1>orche<span>stra</span></h1>
  <p style="color:var(--dim)">Paste your operator token (from <code>tokens.json</code> on the server). It's kept as a cookie on this device.</p>
  <form onsubmit="login(event)">
    <input id="tok" type="password" autocomplete="current-password" placeholder="token" required>
    <div class="row" style="margin-top:10px"><button class="primary" type="submit">Sign in</button></div>
  </form>
</div>

<div id="app" hidden>
  <header>
    <h1>orche<span>stra</span></h1>
    <span class="dot" id="live" title="stream"></span>
    <span class="meta" id="meta"></span>
    <span class="spacer"></span>
    <button id="pushBtn" onclick="enablePush()">🔔 Enable push</button>
    <button class="danger" onclick="haltAll()">⏸ Halt all</button>
    <button onclick="resumeAll()">▶ Resume</button>
  </header>
  <nav class="tabs">
    <button data-tab="inbox" class="active">Inbox <span id="tabInbox"></span></button>
    <button data-tab="feed">Feed</button>
    <button data-tab="side">Sessions</button>
  </nav>
  <main>
    <section id="inbox" class="active">
      <h2>Inbox <span class="count" id="openCount">0</span></h2>
      <div id="open"></div>
      <details class="closed"><summary>Recently closed</summary><div id="closed"></div></details>
    </section>
    <section id="feed">
      <h2>Bus</h2>
      <div class="feed-tools">
        <label><input type="checkbox" id="hideStatus"> hide status</label>
        <label><input type="checkbox" id="onlyMine"> only to/from me</label>
      </div>
      <div class="feed" id="events"></div>
    </section>
    <section id="side">
      <div class="panel">
        <h2 style="margin-top:0">Send</h2>
        <select id="to"></select>
        <textarea id="msg" placeholder="notice to sessions…" style="margin-top:8px" rows="3"></textarea>
        <div class="row">
          <select id="sendKind" style="flex:1"><option value="notice">notice</option><option value="request">request (wants reply)</option><option value="info">info</option></select>
          <button class="primary" onclick="send()">Send</button>
        </div>
        <div class="hint">Ctrl/⌘+Enter sends. Notices are pushed into the session as a turn.</div>
      </div>
      <h2>Sessions <span class="count" id="liveCount">0</span></h2>
      <div id="sessions"></div>
      <div class="hint" style="margin-top:12px"><a href="#" onclick="testPush();return false" style="color:var(--dim)">send test push</a> · <a href="#" onclick="logout();return false" style="color:var(--dim)">sign out</a></div>
    </section>
  </main>
</div>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let state = null, events = [], es = null, pubKey = null;
const OP = () => (state && state.operator) || "operator";
const drafts = {};

function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2600); }

async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: "same-origin", headers: { "content-type": "application/json" }, ...opts });
  if (r.status === 401) { showLogin(); throw new Error("signed out"); }
  if (!r.ok) { let d = r.statusText; try { d = (await r.json()).detail || d; } catch {} throw new Error(d); }
  return r.json();
}

function showLogin() { $("#app").hidden = true; $("#login").hidden = false; if (es) es.close(); }
async function login(e) {
  e.preventDefault();
  try { await api("/api/login", { method: "POST", body: JSON.stringify({ token: $("#tok").value.trim() }) }); $("#tok").value = ""; boot(); }
  catch (err) { toast("sign-in failed: " + err.message); }
}
async function logout() { await api("/api/logout", { method: "POST" }); showLogin(); }

// ---- time ----
function hhmm(iso) { const d = new Date(iso); return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago"; return Math.floor(s / 86400) + "d ago";
}
function left(iso) {
  const s = Math.round((new Date(iso) - Date.now()) / 1000);
  if (s <= 0) return "defaulting…";
  const m = Math.floor(s / 60), h = Math.floor(m / 60);
  return h ? `${h}h ${m % 60}m left` : m ? `${m}m ${s % 60}s left` : `${s}s left`;
}

// ---- inbox ----
function threadCard(t, closed) {
  const kind = t.kind;
  const topic = t.topic ? ` · <span>#${esc(t.topic)}</span>` : "";
  let extra = "";
  if (kind === "ask") {
    extra = `<div class="dflt">default: <b>${esc(t.default)}</b>${t.revert_cost ? ` · revert: ${esc(t.revert_cost)}` : ""}</div>`;
    if (!closed) extra += `<div class="countdown" data-deadline="${esc(t.deadline)}">${left(t.deadline)}</div>`;
  }
  let actions = "";
  if (!closed) {
    const ph = kind === "note" ? "reply (optional)…" : "your answer…";
    actions = `<div class="actions">
      <textarea data-draft="${t.id}" rows="2" placeholder="${ph}">${esc(drafts[t.id] || "")}</textarea>
      <button class="primary" onclick="answer('${t.id}')">${kind === "note" ? "Reply" : "Answer"}</button>
      ${kind === "ask" ? `<button onclick="takeDefault('${t.id}')">Take default</button>` : ""}
      <button onclick="ack('${t.id}')">${kind === "note" ? "Seen ✓" : "Ack"}</button>
    </div>`;
  } else {
    actions = `<div class="res">${esc(t.status)}${t.resolution ? ": " + esc(t.resolution) : ""} · ${ago(t.resolved_at || t.ts)}</div>`;
  }
  return `<div class="card ${kind}${closed ? " done" : ""}" id="t-${t.id}">
    <div class="top"><span class="badge ${kind}">${kind}</span><span class="from">${esc(t.from)}</span>${topic}<span>· ${ago(t.ts)}</span><span style="margin-left:auto;color:var(--faint)">${t.id}</span></div>
    <div class="body">${esc(t.body)}</div>${extra}${actions}</div>`;
}

function renderInbox() {
  const open = state.inbox.open, closed = state.inbox.closed;
  $("#open").innerHTML = open.length ? open.map((t) => threadCard(t, false)).join("") : `<div class="empty">inbox zero ✨ everyone's cooking</div>`;
  $("#closed").innerHTML = closed.map((t) => threadCard(t, true)).join("") || `<div class="empty">nothing yet</div>`;
  $("#openCount").textContent = open.length;
  const asks = open.filter((t) => t.kind === "ask").length;
  $("#tabInbox").textContent = open.length ? `${open.length}${asks ? "⏳" : ""}` : "";
  document.title = open.length ? `(${open.length}) orchestra` : "orchestra";
  document.querySelectorAll("textarea[data-draft]").forEach((ta) => {
    ta.oninput = () => (drafts[ta.dataset.draft] = ta.value);
    ta.onkeydown = (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) answer(ta.dataset.draft); };
  });
  flashHash();
}

async function closeThread(kind, id, body) {
  try {
    await api("/api/events", { method: "POST", body: JSON.stringify({ from: "operator", kind, ref: id, body }) });
    delete drafts[id]; await refresh(); toast(kind === "answer" ? "sent ✓" : "closed ✓");
  } catch (e) { toast("failed: " + e.message); }
}
function answer(id) {
  const body = (drafts[id] || "").trim();
  const t = state.inbox.open.find((x) => x.id === id);
  if (!body) { if (t && t.kind === "note") return ack(id); return toast("write an answer first"); }
  closeThread("answer", id, body);
}
function takeDefault(id) { const t = state.inbox.open.find((x) => x.id === id); closeThread("answer", id, `take the default: ${t ? t.default : ""}`); }
function ack(id) { closeThread("ack", id, (drafts[id] || "").trim()); }

// ---- feed ----
function evRow(e) {
  const ref = e.ref ? ` <span style="color:var(--faint)">re ${esc(e.ref)}</span>` : "";
  const topic = e.topic ? ` <span style="color:var(--faint)">#${esc(e.topic)}</span>` : "";
  const extra = e.kind === "ask" ? `\n→ default: ${e.default}` : "";
  return `<div class="ev ${e.from === OP() ? "op" : ""} ${esc(e.kind)}">
    <div class="ts" title="${esc(e.ts)}">${hhmm(e.ts)}</div>
    <div><div class="who"><b>${esc(e.from)}</b> → ${esc(e.to)} <span class="k">${esc(e.kind)}</span>${ref}${topic}</div>
    <div class="txt">${esc(e.body)}${esc(extra)}</div></div></div>`;
}
function renderFeed() {
  const hide = $("#hideStatus").checked, mine = $("#onlyMine").checked;
  const shown = events.filter((e) => (!hide || e.kind !== "status") && (!mine || e.from === OP() || e.to === "@" + OP()));
  $("#events").innerHTML = shown.slice(-300).reverse().map(evRow).join("") || `<div class="empty">quiet bus</div>`;
}

// ---- sessions ----
function renderSessions() {
  const ps = state.presence;
  const live = ps.filter((p) => p.live);
  $("#liveCount").textContent = live.length;
  $("#sessions").innerHTML = ps.length ? ps.map((p) => `<div class="sess">
      <span class="dot ${p.live ? "on" : ""}"></span>
      <span class="h" title="${esc(p.cwd || "")}">${esc(p.handle)}</span>
      ${p.channel ? "" : `<span class="np" title="no push lane: launched without the channel flag">no push</span>`}
      <span class="st">${p.live ? esc(p.status || "") : ago(p.last_seen)}</span></div>`).join("")
    : `<div class="empty">no sessions have checked in</div>`;
  const sel = $("#to"), cur = sel.value;
  sel.innerHTML = `<option value="@all">@all (everyone)</option>` + live.map((p) => `<option value="@${esc(p.handle)}">@${esc(p.handle)}</option>`).join("");
  if ([...sel.options].some((o) => o.value === cur)) sel.value = cur;
  const pushOk = state.push && state.push.subscriptions > 0;
  $("#meta").textContent = `${live.length} live · bus #${state.head}${pushOk ? "" : " · push off"}`;
}

async function send() {
  const body = $("#msg").value.trim(); if (!body) return;
  try {
    await api("/api/events", { method: "POST", body: JSON.stringify({ from: "operator", to: $("#to").value, kind: $("#sendKind").value, body }) });
    $("#msg").value = ""; toast("sent ✓");
  } catch (e) { toast("failed: " + e.message); }
}
async function haltAll() {
  const why = prompt("Halt everyone? Reason (optional):", "");
  if (why === null) return;
  await api("/api/events", { method: "POST", body: JSON.stringify({ from: "operator", to: "@all", kind: "halt", body: why }) });
  toast("halt sent");
}
async function resumeAll() {
  const msg = prompt("Resume everyone. Message (optional):", "");
  if (msg === null) return;
  await api("/api/events", { method: "POST", body: JSON.stringify({ from: "operator", to: "@all", kind: "resume", body: msg }) });
  toast("resume sent");
}

// ---- push ----
function b64ToBytes(b64) { const p = "=".repeat((4 - (b64.length % 4)) % 4); const raw = atob((b64 + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(raw, (c) => c.charCodeAt(0)); }
async function swReg() { return navigator.serviceWorker.register("/sw.js", { scope: "/" }); }
async function enablePush() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return toast("this browser can't do web push");
  if (!pubKey) return toast("server has no push key");
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") return toast("notifications not allowed");
    const reg = await swReg();
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(pubKey) });
    await api("/api/push/subscribe", { method: "POST", body: JSON.stringify(sub.toJSON()) });
    toast("push on for this device 🔔"); updatePushBtn(); refresh();
  } catch (e) { toast("push failed: " + e.message); }
}
async function updatePushBtn() {
  const btn = $("#pushBtn");
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) { btn.hidden = true; return; }
  const reg = await navigator.serviceWorker.getRegistration("/");
  const sub = reg && (await reg.pushManager.getSubscription());
  btn.textContent = sub && Notification.permission === "granted" ? "🔔 Push on" : "🔔 Enable push";
}
async function testPush() { try { const r = await api("/api/push/test", { method: "POST" }); toast(`test push → ${r.delivered} device(s)`); } catch (e) { toast(e.message); } }

// ---- live ----
async function refresh() { state = await api("/api/state"); pubKey = state.push && state.push.public_key; renderInbox(); renderSessions(); }
function connect() {
  if (es) es.close();
  const after = events.length ? events[events.length - 1].seq : state.head;
  es = new EventSource(`/api/stream?after=${after}`);
  es.addEventListener("bus", (m) => {
    const e = JSON.parse(m.data);
    if (events.length && e.seq <= events[events.length - 1].seq) return;
    events.push(e); renderFeed();
    if (["ask", "request", "note", "answer", "ack", "defaulted", "withdraw"].includes(e.kind)) refresh();
    else { state.head = e.seq; renderSessions(); }
  });
  es.onopen = () => $("#live").classList.add("on");
  es.onerror = () => $("#live").classList.remove("on");
}
function flashHash() {
  const m = location.hash.match(/t=([\w-]+)/); if (!m) return;
  const el = document.getElementById("t-" + m[1]); if (!el) return;
  el.classList.add("flash"); el.scrollIntoView({ block: "center" }); setTimeout(() => el.classList.remove("flash"), 2500);
  history.replaceState(null, "", location.pathname);
}

async function boot() {
  try { await refresh(); } catch { return; }
  $("#login").hidden = true; $("#app").hidden = false;
  const d = await api(`/api/events?after=${Math.max(0, state.head - 300)}&limit=300`);
  events = d.events; renderFeed(); connect(); updatePushBtn();
  if ("serviceWorker" in navigator) swReg().catch(() => {});
}

document.querySelectorAll("nav.tabs button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("nav.tabs button").forEach((x) => x.classList.toggle("active", x === b));
  document.querySelectorAll("main > section").forEach((s) => s.classList.toggle("active", s.id === b.dataset.tab));
});
$("#hideStatus").onchange = renderFeed; $("#onlyMine").onchange = renderFeed;
$("#msg").onkeydown = (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send(); };
setInterval(() => { document.querySelectorAll(".countdown").forEach((el) => (el.textContent = left(el.dataset.deadline))); }, 1000);
setInterval(() => { if (state) refresh().catch(() => {}); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && state) refresh().catch(() => {}); });
window.addEventListener("hashchange", flashHash);
boot();
</script>
</body>
</html>
