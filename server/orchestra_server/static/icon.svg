<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><title>orchestra</title>
<rect width="96" height="96" rx="22" fill="#14121a"/>
<!-- the conductor cat (design/mascots), scaled into the maskable safe zone -->
<g transform="translate(48 48) scale(.86) translate(-48 -48)">
  <g fill="none" stroke="#c39bff" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- head and ears -->
    <path d="M24 44 L22 22 L37 33 Q46 30 55 33 L70 22 L68 44 Q70 66 46 68 Q22 66 24 44 Z"/>
    <!-- eyes shut, lost in the music -->
    <path d="M33 46 Q37 42 41 46"/>
    <path d="M51 46 Q55 42 59 46"/>
    <!-- nose and mouth -->
    <path d="M44 53 L48 53 L46 56 Z" stroke-width="3"/>
    <path d="M46 56 Q43 60 40 58 M46 56 Q49 60 52 58" stroke-width="3"/>
    <!-- baton, raised -->
    <path d="M66 80 L84 52"/>
  </g>
  <!-- the beat: baton tip, and a bow tie -->
  <circle cx="84" cy="52" r="5" fill="#ff6b7d"/>
  <path d="M36 74 L46 79 L56 74 L56 84 L46 79 L36 84 Z" fill="#ff6b7d"/>
</g>
</svg>
