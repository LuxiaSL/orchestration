[project]
name = "orchestra-server"
version = "0.1.0"
description = "The orchestra bus: an append-only ledger, the operator's inbox page, and phone push"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pywebpush>=2.0",
    "py-vapid>=1.9",
]

[project.scripts]
orchestra-server = "orchestra_server.app:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestra_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
